[mod]
id          = "talent-grant"
name        = "Talent Grant (dev)"
version     = "0.1.0"
author      = "RSMM"
description = "Testing tool: gives the local hero a chosen talent at a chosen rarity at the start of each run, so a modded talent can be tried without waiting for the game to offer it."
enabled     = false
load_order  = 90
sdk_version = ">=3.0,<4"
license     = "MIT"
tags        = ["dev", "talents", "testing"]
# Grants a talent to THIS machine's hero only. That is a gameplay change, so in
# co-op each peer running it affects only themselves.
multiplayer_scope = "local-only"

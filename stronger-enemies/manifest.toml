[mod]
id          = "stronger-enemies"
name        = "Stronger Enemies"
version     = "1.7.0"
author      = "Ovilli"
license     = "MIT"
summary     = "Tougher monsters and bosses: set enemy health and damage multipliers, and force the corrupted variant on every enemy that supports it."
description = """Raises the game's own chapter scaling for every enemy tier (common, elite, boss) on every difficulty by multipliers you choose in the mod's settings (default: health x1.5, damage +25%), and can force the corrupted (tainted) variant on every enemy that supports it: bigger, glowing, +50% health, +75% damage. Heroes are untouched. Changes apply the next time you launch the game."""
sdk_version = "3"
enabled     = false
tags        = ["difficulty", "enemies", "bosses"]
# Enemy health and damage are simulated by the host; everyone in the party
# should run the same version so the numbers agree.
multiplayer_scope = "host-authoritative"

# EntitySettings/Common_Settings/Group_Scaling (read 2026-10-16):
#   Chapter N Max Health / Damage Multiplier Selector, entries obj_4..obj_7 =
#   difficulty 0..3, each (int key, f32 value) -> [1] is the value.
#   They feed only Common / Elite / Boss Enemy Group (value_10 / value_11);
#   Hero Group does not read them. Each step multiplies the shipped value (`times`) by the
#   player's config multiplier.
[[content]]
kind   = "entity"
id     = "group_scaling"
entity = "Common_Settings/Group_Scaling"

[[content.steps]]
set    = "Chapter 1 Max Health Multiplier Selector.obj_4[1]"
config = "health"
times  = 1   # shipped value

[[content.steps]]
set    = "Chapter 1 Max Health Multiplier Selector.obj_5[1]"
config = "health"
times  = 1   # shipped value

[[content.steps]]
set    = "Chapter 1 Max Health Multiplier Selector.obj_6[1]"
config = "health"
times  = 1   # shipped value

[[content.steps]]
set    = "Chapter 1 Max Health Multiplier Selector.obj_7[1]"
config = "health"
times  = 1   # shipped value

[[content.steps]]
set    = "Chapter 2 Max Health Multiplier Selector.obj_4[1]"
config = "health"
times  = 2   # shipped value

[[content.steps]]
set    = "Chapter 2 Max Health Multiplier Selector.obj_5[1]"
config = "health"
times  = 2.2   # shipped value

[[content.steps]]
set    = "Chapter 2 Max Health Multiplier Selector.obj_6[1]"
config = "health"
times  = 2.4   # shipped value

[[content.steps]]
set    = "Chapter 2 Max Health Multiplier Selector.obj_7[1]"
config = "health"
times  = 2.5   # shipped value

[[content.steps]]
set    = "Chapter 3 Max Health Multiplier Selector.obj_4[1]"
config = "health"
times  = 4   # shipped value

[[content.steps]]
set    = "Chapter 3 Max Health Multiplier Selector.obj_5[1]"
config = "health"
times  = 4.5   # shipped value

[[content.steps]]
set    = "Chapter 3 Max Health Multiplier Selector.obj_6[1]"
config = "health"
times  = 5   # shipped value

[[content.steps]]
set    = "Chapter 3 Max Health Multiplier Selector.obj_7[1]"
config = "health"
times  = 5.2   # shipped value

[[content.steps]]
set    = "Chapter 4 Max Health Multiplier Selector.obj_4[1]"
config = "health"
times  = 4.2   # shipped value

[[content.steps]]
set    = "Chapter 4 Max Health Multiplier Selector.obj_5[1]"
config = "health"
times  = 4.7   # shipped value

[[content.steps]]
set    = "Chapter 4 Max Health Multiplier Selector.obj_6[1]"
config = "health"
times  = 5.2   # shipped value

[[content.steps]]
set    = "Chapter 4 Max Health Multiplier Selector.obj_7[1]"
config = "health"
times  = 5.4   # shipped value

[[content.steps]]
set    = "Chapter Stagger Multiplier Selector.obj_4[1]"
config = "stagger"
times  = 1   # shipped value

[[content.steps]]
set    = "Chapter Stagger Multiplier Selector.obj_5[1]"
config = "stagger"
times  = 1.2   # shipped value

[[content.steps]]
set    = "Chapter Stagger Multiplier Selector.obj_6[1]"
config = "stagger"

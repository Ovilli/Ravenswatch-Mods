# Jack, the Giant-Slayer: Jack and the Beanstalk as a playable hero.
#
# Built on Kintaro (Passtech's own little boy and his axe animations), ON FOOT
# ONLY: Kuma the bear is never spawned. Jack's look is Kintaro's mesh
# repainted (art/jack_kintaro_alb.png) until the custom model exists.
#
# Not a Frankenstein clone: the base gives the skeleton, the animations and
# the fixed talent slots. Every talent that leaned on the bear, and every one
# that can be said in generated parts, is REBUILT (`talents`: base logic cut,
# stats/windows/actions written from these numbers). Every button gains a
# generated beanstalk action (`kit`). The previous Beowulf version is kept at
# ~/.cache/rsmm/jack-kit/manifest.beowulf.toml.
#
# NOT PLAYTESTED. Watch in game: starts on foot, no bear anywhere, SPECIAL
# leaps where you aim, TRAIT plants a bean that bursts, each rebuilt talent.

[mod]
id           = "jack"
name         = "Jack, the Giant-Slayer"
version      = "0.2.0"
author       = "Ovilli"
description  = "Jack and the Beanstalk as a playable hero: a farm boy with a woodcutter's axe and a pocket of magic beans."
enabled      = false
load_order   = 95
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind        = "hero"
id          = "Jack"
base        = "Kintaro"
name        = "Jack"
description = "Jack traded the family cow for a handful of beans, and by morning a beanstalk reached the clouds. He climbed it, found a giant's castle, and came home with the giant's gold and the giant's axe-blade nightmares on his heels.\nNow every pocket is full of magic beans, and every bean is a beanstalk waiting to happen."

# --- Look --------------------------------------------------------------------
# Kintaro's boy, repainted: fair skin, straw-blond hair, moss-green tunic,
# brown trousers, leather wraps, ochre rope belt.
[content.materials.M_Kintaro]
albedo = "art/jack_kintaro_alb.png"

[content.effects."*"]
tint = "#7fc23a"

# --- On foot, no bear --------------------------------------------------------
# Start in the on-foot form (Hero_Alt_Form_Common reads this at Event
# Initialize: 1 = riding Kuma, 0 = on foot).
[[content.abilities]]
set   = "Initialize In Default Form Value.value"
value = 0

# Kuma is only ever created here (Bear Spawner, fired as the hero initializes).
[[content.abilities]]
remove_link = "Child Event Initialize.activates"
to          = "Bear Spawner"

# The on-foot SPECIAL leaps toward Kuma unless "use aim dir" is on: keep it
# on for good, so it is a leap where you aim (max 10 m) ...
[[content.abilities]]
add_link = "Child Event Initialize.activates"
to       = "Flag Dismounted Secondary Ability Use Aim Dir"

# ... and do not snap round to look at a bear that is not there.
[[content.abilities]]
remove_link = "State Dismounted Secondary Ability Control.activates"
to          = "Dismounted Secondary Ability Snap Look At"

# --- Buttons: each keeps its move and gains a beanstalk ----------------------
# hit = a delayed ground burst (radius m, damage % of a hit, delay s).
[content.kit]
# Axe combo: the finisher fells a beanstalk that bursts in front of him.
attack  = { when = "Event Dismounted Basic Attack Active Finisher", steps = [
    { hit = { radius = 3, damage = 120, delay = 0.3 } },
] }
# Whirl: beans scatter and burst around him as he spins.
power   = { when = "State Dismounted Primary Ability Active", steps = [
    { wait = 0.2 },
    { hit = { radius = 3.5, damage = 150, delay = 0.4 } },
] }
# Leap: he lands and a beanstalk bursts where he lands.
special = { when = "Event Dismounted Secondary Ability Active", steps = [
    { hit = { radius = 4, damage = 150, delay = 0.1 } },
] }
# Shout: the beans in his pockets pop.
defense = { when = "Event Dismounted Defensive Ability Active", steps = [
    { hit = { radius = 3.5, damage = 80, delay = 0.1 } },
] }
# Ultimate (the giant slam): a giant beanstalk crashes down.
ultimate = { when = "Event Ultimate Ability 1 Step 2 Active", steps = [
    { hit = { radius = 7, damage = 300, delay = 0.2 } },
] }
# TRAIT, his own button now (no bear to ride): plant a magic bean that bursts
# into a beanstalk a second later.
trait = { replace = true, steps = [
    { hit = { radius = 4, damage = 250, delay = 1.0 } },
] }

# --- Talents --------------------------------------------------------------
# rebuild (default true) cuts the base talent's logic; add_stats / actions are
# written from these numbers ({N} on the card = the add_stats, in order).
# actions run each time `on` fires while the talent is owned
# (dash, power, special, defense, ultimate, damage_taken, night_start ...).

[content.talents."Passive Move Speed"]
name        = "Light Feet"
description = "• Gain &+{0}%~ #MOVE SPEED@"
add_stats   = [ { stat = "Move Speed Ratio", values = [0.08, 0.11, 0.14, 0.18] } ]

[content.talents."Passive Bear Combo"]
name        = "Woodcutter's Rhythm"
description = "• #ATTACK@ deals &+{0}%~ damage"
add_stats   = [ { stat = "Attack power basic", values = [0.15, 0.22, 0.30, 0.40] } ]

[content.talents."Passive Armor"]
name        = "Thick Wool"
description = "• Gain &+{0}~ #ARMOR@"
add_stats   = [ { stat = "Armour", values = [5, 8, 11, 15], percent = false } ]

[content.talents."Passive Ability Attack"]
name        = "Bean Burst"
description = "• Using #POWER@ makes a beanstalk burst from the ground around you, dealing #150%@ area damage"
actions     = [ { on = "power", steps = [ { wait = 0.3 }, { hit = { radius = 4, damage = 150, delay = 0.3 } } ] } ]

[content.talents."Passive Internal Damage"]
name        = "Mother's Broth"
description = "• Healing you receive is increased by &+{0}%~"
add_stats   = [ { stat = "Increase healing received", values = [0.15, 0.20, 0.25, 0.30] } ]

[content.talents."Passive AP Per Internal Damage"]
name        = "Giant-Slayer"
description = "• Deal &+{0}%~ damage to bosses"
add_stats   = [ { stat = "Increase damage to boss", values = [0.10, 0.15, 0.20, 0.25] } ]

[content.talents."Dash Attack"]
name        = "Bean Vault"
description = "• #DASH@ deals &+{0}%~ damage\n• A beanstalk bursts where you land, dealing #120%@ area damage"
add_stats   = [ { stat = "Attack power dash", values = [0.20, 0.30, 0.40, 0.50] } ]
actions     = [ { on = "dash", steps = [ { hit = { radius = 3, damage = 120, delay = 0.3 } } ] } ]

[content.talents."Trait Heal"]
name        = "Packed Lunch"
description = "• Using #DEFENSE@ restores #25@ health"
actions     = [ { on = "defense", steps = [ { heal = 25 } ] } ]

[content.talents."Attack Bite"]
name        = "Sharp Axe"
description = "• #ATTACK@ gains &+{0}%~ #Crit Chance@"
add_stats   = [ { stat = "Crit chance basic", values = [0.08, 0.12, 0.16, 0.20] } ]

[content.talents."Power Bear Charge"]
name        = "Popping Beans"
description = "• Using #POWER@ makes beans pop around you #3@ times, each dealing #80%@ area damage"
actions     = [ { on = "power", steps = [
    { repeat = 3, every = 0.3, steps = [ { hit = { radius = 2.5, damage = 80, delay = 0.2 } } ] } ] } ]

[content.talents."Defense Deals Damage"]
name        = "Fee-Fi-Fo-Fum!"
description = "• Using #DEFENSE@ calls the giant's foot down around you a moment later, dealing #200%@ damage in a wide area"
actions     = [ { on = "defense", steps = [ { hit = { radius = 6, damage = 200, delay = 0.6 } } ] } ]

[content.talents."Special Buff After Power"]
name        = "Second Wind"
description = "• For #3@ seconds after #SPECIAL@, gain &+{0}%~ #MOVE SPEED@"
add_stats   = [ { stat = "Move Speed Ratio", values = [0.15, 0.20, 0.25, 0.30], after = "SPECIAL", seconds = 3 } ]

[content.talents."Defense Attack Block"]
name        = "Hide in the Pot"
description = "• While using #DEFENSE@ you are #INVULNERABLE@"
add_stats   = [ { stat = "Invulnerable", during = "DEFENSE" } ]

[content.talents."Attack Chain Speed"]
name        = "Run, Jack, Run"
description = "• After taking damage, gain &+{0}%~ #MOVE SPEED@ for #3@ seconds"
add_stats   = [ { stat = "Move Speed Ratio", values = [0.20, 0.28, 0.36, 0.45], on = "damage_taken", seconds = 3 } ]

# Talents that are Jack's own on-foot moves keep their logic (new cards).
[content.talents."Special Delayed AOE"]
rebuild     = false
name        = "Seed Pods"
description = "• #SPECIAL@ leaves seed pods in the ground that burst after a short time, dealing &{0}%~ area damage"

[content.talents."Power Throws Axe"]
rebuild     = false
name        = "Boomerang Axe"
description = "• When triggering #POWER@, {0} throws his axe, which bounces up to #{1}@ times between nearby enemies, dealing &{2}%~ damage to each target hit"

[content.talents."Power Hold"]
rebuild     = false
name        = "Wind-Up"
description = "• #POWER@ can be held to store up to #3@ levels of charge before it is released\n• Each charge level increases its #Crit Chance@ by &{0}%~"

[content.talents."Power Chain Damage"]
rebuild     = false
name        = "Timber!"
description = "• #POWER@ deals &+{0}%~ damage for each different enemy hit (up to #+{1}%@)"

[content.talents."Attack Special Swipe"]
rebuild     = false
name        = "Woodcutter's Swipe"
description = "• {0}'s #ATTACK@, triggered shortly after a #SPECIAL@, performs a sweep of his axe that deals &{1}~ area damage"

[content.talents."Special Dash After Power"]
rebuild     = false
name        = "Up the Beanstalk"
description = "• Using #DASH@ just after #POWER@ makes {0} leap forward and triggers a #SPECIAL@ effect in the area around where he lands, dealing &{1}%~ #SPECIAL@ damage"

[content.talents."Defense Summon Spirit"]
rebuild     = false
name        = "Garden Sprites"
description = "• Whenever {0} blocks an attack, a garden sprite appears around him (up to #{1}@)\n• For each successful #ATTACK@, a sprite is released, dealing &{2}~ damage, and then disappears"

[content.talents."Attack Quest Lightning"]
rebuild     = false
name        = "Stormseed"
description = "• #Quest (x{0}):@ Spending #{1} Dream Shards@ grants #+{2}@ #Crit Chance@\n• #Complete:@ #ATTACK@ finisher calls #{3}@ lightning strikes down on nearby enemies, with each strike dealing &{4}~ damage"

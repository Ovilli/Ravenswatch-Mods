# --- The book: Jack's story (Beowulf has 7 pages) -----------------------------
[[content.memoirs]]
title = "Milky-White"
text  = "There was a widow's boy named Jack, and a cow named Milky-White who gave no more milk. \"Take her to market,\" said his mother, \"and bring back money, or we starve.\" Jack walked the long road with the rope in his hand, and he did not come back with money."

[[content.memoirs]]
title = "Five Beans"
text  = "On the road he met a stranger with a crooked smile and five beans in his palm, speckled like eggs. \"Magic,\" said the stranger. \"Plant them at night, and by morning they'll reach the sky.\" Jack traded the cow. His mother wept and threw the beans out of the window."

[[content.memoirs]]
title = "Overnight"
text  = "In the night the beans woke. The stalk tore up the garden, split the well, and climbed past the clouds, thick as a tower and green as poison. In the morning Jack looked up at it for a long time. Then he took his father's axe, and he climbed."

[[content.memoirs]]
title = "Fee-Fi-Fo-Fum"
text  = "At the top stood a castle, and in the castle a giant who ground bones to make his bread. Jack hid in the oven, then in the great copper pot, while the giant sniffed the air. He waited until the snoring shook the walls. Then he took the gold, and the harp, and the hen."

[[content.memoirs]]
title = "Timber"
text  = "The giant woke to the harp's screaming and came down the beanstalk after him, each step a thunderclap. Jack reached the ground first. He swung the axe until his hands bled, and the stalk groaned, and leaned, and fell, and the giant fell with it, all the way down."

[[content.memoirs]]
title = "The Golden Hen"
text  = "The gold was spent. The harp would not stop weeping, so they sold it. But the hen stayed. She laid her golden eggs and slept on Jack's shoulder, and when the first Nightmares came out of the woods, she opened her beak and breathed a fire the colour of the sun."

[[content.memoirs]]
title = "Giant-Slayer"
text  = "The Nightmares grew bigger every night, and Jack found he did not mind. He had climbed higher than any of them, and he had felled a giant with a woodcutter's axe. \"The bigger they are,\" he tells the hen, sharpening the blade, \"the further they fall.\""

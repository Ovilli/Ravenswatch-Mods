# Jack, the Giant-Slayer: Jack and the Beanstalk as a playable hero.
#
# Built on Beowulf (base game). Beowulf's dragon becomes the Golden Hen, the
# giant's treasure Jack stole from the castle above the clouds: she still
# empowers his next move, breathes (golden) fire and flies. His shockwave is
# a line of beanstalks tearing out of the ground; his shield is the giant's
# copper pot lid that Jack hid under.
#
# v0.1 = identity: name, story, every ability and talent card, body/gear/hen
# textures, effects (gold fire, green beanstalks). Gameplay is Beowulf's.
# The 3D model (Jack's body + an axe + the hen) is handed off: MODEL_BRIEF.md.

[mod]
id           = "jack"
name         = "Jack, the Giant-Slayer"
version      = "0.1.0"
author       = "Ovilli"
description  = "Jack and the Beanstalk as a playable hero: a woodcutter with a stolen golden hen, built on Beowulf."
enabled      = false
load_order   = 95
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind        = "hero"
id          = "Jack"
base        = "Beowulf"
name        = "Jack"
description = "Jack traded the family cow for a handful of beans, and by morning a beanstalk reached the clouds. He climbed it, found a giant's castle, and stole its treasures: a bag of gold, a singing harp, and a hen that lays golden eggs and breathes golden fire. Now the hen is his only friend and the woodcutter's axe his only trade.\nFee-fi-fo-fum: the Nightmares can smell him coming."

# --- Look --------------------------------------------------------------------
# Beowulf's own maps, recoloured: moss-green tunic, brown wool, ochre sash.
albedo = "art/jack_body_alb.png"

# Sword, shield and the Wyrm share one map: steel kept, the shield turned
# copper (the pot lid) and the Wyrm gold with brown wings (the Golden Hen).
# The shield's label shares the sword's material, so one entry covers both.
[content.weapons."Weapon In Right Hand Mesh"]
albedo = "art/jack_acc_alb.png"

[content.weapons."Chatacter Mesh Wyrm"]
albedo = "art/jack_acc_alb.png"

# Golden fire everywhere; the shockwave family is beanstalk green.
[content.effects."*"]
tint = "#e8b23a"

[content.effects.Power_Shockwave]
tint = "#6fbf3a"

[content.effects.Power_Sword_Ground_Scrape]
tint = "#6fbf3a"

[content.effects.Beowulf_Secondary_Tremor_Warning_01]
tint = "#6fbf3a"

[content.effects.Skill_Special_MultiShock_01]
tint = "#6fbf3a"

[content.effects.Skill_Power_Explosion_Regular]
tint = "#6fbf3a"

[content.effects.Beowulf_Runes_Of_War_Aura_01]
tint = "#6fbf3a"

[content.effects.Beowulf_Runes_Of_War_Swirl_01]
tint = "#6fbf3a"


# Throwaway bisect for "right stick aim lost with piper-horde-rats" (2026-10-23).
# Enable ONE piper-aim-bisect-* at a time (and not piper-horde-rats), play Piper
# on a controller, and check whether the right stick still aims basic attacks.

[mod]
id          = "piper-aim-bisect-c"
name        = "Piper aim bisect C"
version     = "0.1.0"
author      = "Ovilli"
license     = "MIT"
description = "One unused copied node: does ANY rebuild of Hero_Piper break aim?"
sdk_version = "3"
enabled     = false
tags        = ["piper", "test"]
experimental = true
multiplayer_scope = "deterministic-shared"
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind = "talent"
id   = "rebuild_only"
hero = "Piper"
file = "Hero_Piper.entity"

clone_nodes = [
  { source = "Skill Attack Ghost Notes Requirement Selector", name = "Bisect Unused Selector" },
]

# Piper — Horde: rats every X basic attacks
#
# HOW THE PIECES ARE WIRED (read off Hero_Piper.entity, 2026-09-13)
# ------------------------------------------------------------------
# Horde (`Skill Controller Trait More Controllable Pets`) switches on the state
# `Skill Trait More Controllable Pets`. Nothing listens to that state except two
# selectors — rats spawn in groups of 3, and the rat cap goes from 20 to 26 / 28
# / 30 / 32 by rarity — plus its one child, the Legendary tester.
#
# Ghost Notes already has an "every N notes" machine:
#   Event Attack Shoot Active (every ATTACK / POWER / ULTIMATE note)
#     -> Skill Attack Ghost Notes Notify Tester   [sub-test: Ghost Notes state active]
#     -> ... -> SKILL_ATTACK_GHOST_NOTES_COUNTER_INC Event Sender
#   Skill Attack Ghost Notes Counter  (child of the Ghost Notes state; its
#     settings carry the LOOP flag — the same flag every "every N" and cycling
#     counter in the corpus has) counts that event up to
#     `Skill Attack Ghost Notes Requirement Selector` (10 / 8 / 7 / 6 by rarity)
#     and fires `Event Skill Attack Ghost Notes Proc`.
#
# WHAT THIS MOD BUILDS
# --------------------
# A second copy of that machine, owned by Horde, with its OWN event name:
#   * `Horde Attacks Required Selector`  Ghost Notes' threshold, keyed to Horde.
#   * `Horde Attacks Counter`            Ghost Notes' counter, listening to
#     HORDE_ATTACKS_COUNTER_INC, firing `Horde Rats Proc` at the threshold.
#   * `Horde Attacks State`              Ghost Notes' state, holding the counter
#     and Horde's Legendary tester. Every reference to Horde's old state
#     (controller + both rat selectors) moves here, so owning Horde runs the
#     counter AND keeps groups of 3 and the higher cap.
#
# v0.2 — RATS ATTACK AT ONCE, LIKE INVASIVE BLAST
# `Event Trait Ability Spawn Pets` asks `Trait Ability Spawn Pets Spread Pos
# Selector` which spawn to use: while `Event Skill Defense Spawn Pets Proc` is
# running it picks Invasive Blast's spread (around Piper, smoke puff) and its
# own spawner, whose `Starting Behaviour Spawner Value` starts the rat
# attacking. So the counter ends in Invasive Blast's proc.
#
# v0.3 — THE RAT COUNT
# Invasive Blast's spawn stores its count from its own `Skill Defense Spawn Pets
# Max Count Selector`. To give Horde its own without touching Invasive Blast:
#   * `Horde Rats Count Selector` = that selector keyed to Horde (3/4/5/5).
#   * `Horde Rats Proc` = a one-child event wrapping Invasive Blast's proc.
#   * `Horde Rats Count Switch` = "Horde Rats Proc running ? Horde count :
#     Invasive Blast's count"; Invasive Blast's count store reads the switch.
#
# v0.4 — COUNT BASIC ATTACKS ONLY
# PLAYTESTED 2026-09-13 (v0.3.1): with abilities spammed, rats went to the cap
# (26) in about a second, one spawn after another. Not a bug in the counter —
# every note counted, and the ultimate fires one every 0.1 s (Ultimate Power 1
# Shots Delay) and POWER one every 0.05 s (Primary Ability Shots Delay).
# v0.3 also re-gated Ghost Notes' shared notify tester so every note sent the
# count event. v0.4 removes that change (Ghost Notes is vanilla again) and gives
# Horde a count event of its own, sent only by the BASIC attack shot:
#   Event Basic Attack Shoot Active   (was -> Event Attack Shoot Active)
#     -> `Horde Basic Attack Shoot`   = Event Attack Shoot Active, but its Ghost
#                                        Notes notify child replaced by:
#        -> `Horde Basic Attack Notify` = two children: the Ghost Notes notify
#                                        tester (so Ghost Notes still counts basic
#                                        notes) and
#           -> `HORDE_ATTACKS_COUNTER_INC Event Sender`
# POWER, the ultimate and the dash note still go through the original
# Event Attack Shoot Active, which never sends Horde's event.
#
# v0.4.3 — THE REAL CAUSE OF THE SUDDEN FILL-UP (and of "every 0 notes")
# PLAYTESTED v0.4.2: 3 rats, then one batch up to ~25; the card read "every 0
# notes". A value picker reads its target through a 4-byte ACCESSOR that
# follows the reference label, and the accessor is tied to the target's class
# and value type (value/selector int 65c9d20f, value operation int 8686d20f,
# state 2a83d20f, ...). The count switch's Horde branch was cloned from a Value
# Operation reference and repointed at a Value Selector with the operation
# accessor kept, so the engine read Horde's count with the wrong method and got
# a garbage number; three card slots had the same fault. `clone_nodes` and
# `rewires` now rewrite the accessor for the new target (keeping it when class
# and value type match, so per-rarity controller checks survive). Vanilla Horde
# never did this; the earlier "counts too many notes" fix was real but separate.

# v0.4.4 — CARD SLOT FORMAT
# PLAYTESTED v0.4.3: "For every 6.7263e-44 notes" — 48 read correctly, printed
# as a float. A String Format slot has its own FORMAT TYPE (0 decimal, 1 integer)
# in its entry header, separate from the value's type, and Sound Barrier's slots
# 1 / 3 / 4 were decimal. `clone_nodes` now sets a repointed slot's format type
# from the value it reads and takes its display option from a shipped slot that
# shows the same value (Horde's own card, for three of the five).

# UNPROVEN — watch for these in the playtest
#   * 3 / 4 / 5 attacking rats every 16 BASIC attacks (about 6 s of attacking),
#     and none extra from spamming POWER / the ultimate;
#   * Ghost Notes, if owned, still counting basic attacks AND abilities;
#   * a data-defined event name (HORDE_ATTACKS_COUNTER_INC) being delivered like
#     the shipped ones — if no rats ever spawn, this is the first suspect.

[mod]
id          = "piper-horde-rats"
name        = "Piper: Horde of Rats"
version     = "0.4.5"
author      = "Ovilli"
license     = "MIT"
description = "Horde now also summons 3 / 4 / 5 rats (by rarity) that attack at once, like Invasive Blast, every 16 basic attacks, on top of a higher rat cap."
sdk_version = "3"
enabled     = false
tags        = ["talents", "piper", "rats"]

# `skill` (relabel) is rated below confirmed as a kind.
experimental = true

# Cloned nodes + rewires in the hero entity, plus text. No Lua: the testing
# auto-grant was removed before publishing (use the talent-grant dev mod).
multiplayer_scope = "local-only"

[[content]]
kind = "talent"
id   = "horde_rats_wiring"
hero = "Piper"
file = "Hero_Piper.entity"

clone_nodes = [
  # -- the rat count (v0.3) --------------------------------------------------
  { source = "Skill Defense Spawn Pets Max Count Selector", name = "Horde Rats Count Selector", retarget = [
    { from = '[Dt Skill Controller] Hero_Piper\Skills\Skill Controller Defense Spawn Pets', to = '[Dt Skill Controller] Hero_Piper\Skills\Skill Controller Trait More Controllable Pets' },
  ] },
  { source = "Event Skill Attack Ghost Notes Notify Default", name = "Horde Rats Proc", retarget = [
    { from = '[Named Event Sender] Hero_Piper\Skill Attack Ghost Notes\SKILL_ATTACK_GHOST_NOTES_COUNTER_INC Event Sender', to = '[State] Hero_Piper\Skill Defense Spawn Pets\Event Skill Defense Spawn Pets Proc' },
  ] },
  { source = "Trait Ability Max Controllable Pets Selector", name = "Horde Rats Count Switch", retarget = [
    { from = '[State] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets', to = '[State] Hero_Piper\Skill Trait More Controllable Pets\Horde Rats Proc' },
    { from = '[Value Operation] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets Count Operation', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Horde Rats Count Selector' },
    { from = '[Value] Hero_Piper\Ability Trait\Trait Ability Max Controllable Pets Default Amount', to = '[Value Selector] Hero_Piper\Skill Defense Spawn Pets\Skill Defense Spawn Pets Max Count Selector' },
  ] },

  # -- the counter and its state ---------------------------------------------
  { source = "Skill Attack Ghost Notes Requirement Selector", name = "Horde Attacks Required Selector", retarget = [
    { from = '[Dt Skill Controller] Hero_Piper\Skills\Skill Controller Attack Ghost Notes', to = '[Dt Skill Controller] Hero_Piper\Skills\Skill Controller Trait More Controllable Pets' },
  ] },
  { source = "Skill Attack Ghost Notes Counter", name = "Horde Attacks Counter", retarget = [
    { from = '[State] Hero_Piper\Skill Attack Ghost Notes\Event Skill Attack Ghost Notes Proc', to = '[State] Hero_Piper\Skill Trait More Controllable Pets\Horde Rats Proc' },
    { from = '[Value Selector] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Requirement Selector', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Horde Attacks Required Selector' },
  ], rename = [
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC", to = "HORDE_ATTACKS_COUNTER_INC" },
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_DEC", to = "HORDE_ATTACKS_COUNTER_DEC" },
  ] },
  { source = "Skill Attack Ghost Notes", name = "Horde Attacks State", retarget = [
    { from = '[Counter] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Counter', to = '[Counter] Hero_Piper\Skill Trait More Controllable Pets\Horde Attacks Counter' },
    { from = '[Entity 3d Node] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes 3d Node Left', to = '[Cpnt Value Tester] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets Legendary Tester' },
  ] },

  # -- the basic-attack-only count event (v0.4) --------------------------------
  { source = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC Event Sender", name = "HORDE_ATTACKS_COUNTER_INC Event Sender", rename = [
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC", to = "HORDE_ATTACKS_COUNTER_INC" },
  ] },
  # Two distinct children to repoint, which is why the POWER shot event is the
  # template: Ghost Notes' notify tester, then Horde's sender.
  { source = "Event Primary Ability Shoot", name = "Horde Basic Attack Notify", retarget = [
    { from = '[State] Hero_Piper\Ability Common\Event Attack Shoot Active', to = '[Cpnt Value Tester] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Notify Tester' },
    { from = '[Named Event Sender] Hero_Piper\Ability Primary\Primary Ability Increase Shoot Spawn Index Event Sender', to = '[Named Event Sender] Hero_Piper\Skill Trait More Controllable Pets\HORDE_ATTACKS_COUNTER_INC Event Sender' },
  ] },
  { source = "Event Attack Shoot Active", name = "Horde Basic Attack Shoot", retarget = [
    { from = '[Cpnt Value Tester] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Notify Tester', to = '[State] Hero_Piper\Skill Trait More Controllable Pets\Horde Basic Attack Notify' },
  ] },

  # -- the card text's numbers (v0.4.1) ----------------------------------------
  # Talent cards never spell out rarities: every number is a `{N}` placeholder
  # fed by a String Format node, so the card shows the value for the CURRENT
  # rarity and an upgrade shows what it adds (`&{N}~` marks a value that grows
  # with rarity, `#{N}@` a fixed one). Horde's own format has 3 slots and the
  # new text needs 5, so copy the only 5-slot format on Piper (Sound Barrier's)
  # and point each slot at the Horde value, then give the copy Horde's text key.
  # Slots 1 / 3 / 4 read float values in the source; the clone gives each slot
  # the accessor and value type of the Horde value it now reads.
  #   {0} rats per trigger  (3 / 4 / 5 / 5)   {1} basic attacks needed (16)
  #   {2} rats per group    (Horde: 3)        {3} rats per group without Horde (2)
  #   {4} extra max rats    (6 / 8 / 10 / 12)
  { source = "Skill String Desc Defensive Armor Quest", name = "Skill String Desc Horde Rats", retarget = [
    { from = '[Value Selector] Hero_Piper\Skill Defensive Armor Quest\Skill Defensive Armor Quest Objective Count Selector', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Horde Rats Count Selector' },
    { from = '[Value] Hero_Piper\Skill Defensive Armor Quest\Skill Defensive Armor Quest Armor Per Proc', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Horde Attacks Required Selector' },
    { from = '[Value] Hero_Piper\Skill Defensive Armor Quest\Skill Defensive Armor Quest Character Impacts Required', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets Per Spawn Amount Selector' },
    { from = '[Multi values operations] Hero_Piper\Skill Defensive Armor Quest\Skill Defensive Armor Quest Complete Shield Operation', to = '[Value] Hero_Piper\Ability Trait\Trait Ability Pets Per Spawn Default Amount' },
    { from = '[Value] Hero_Piper\Skill Defensive Armor Quest\Skill Defensive Armor Quest Complete Shield Duration', to = '[Value Selector] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets Amount Selector' },
  ], rename = [
    { from = "Skill_Defense_Armor_Quest_Desc", to = "Skill_Trait_More_Controllable_Pets_Desc" },
  ] },
]

# Selector values sit at odd union indices, highest rarity first, common last.
union_patches = [
  # Every 16 basic attacks at any rarity (Ghost Notes' copy was 6 / 7 / 8 / 10).
  # A basic attack fires a note about every 0.35 s (Basic Attack Continuous
  # Attack: 0.15 delay + 0.2 release), so this is roughly 6 s of attacking.
  # 48 in v0.4.x; lowered to 16 at the user's request once only basic attacks
  # counted.
  { label = "Horde Attacks Required Selector", index = 1, old = 6, new = 16 },
  { label = "Horde Attacks Required Selector", index = 3, old = 7, new = 16 },
  { label = "Horde Attacks Required Selector", index = 5, old = 8, new = 16 },
  { label = "Horde Attacks Required Selector", index = 7, old = 10, new = 16 },
  # 3 rats common, 4 rare, 5 epic and legendary (Invasive Blast's copy was 7 / 6 / 5 / 4).
  { label = "Horde Rats Count Selector", index = 1, old = 7, new = 5 },
  { label = "Horde Rats Count Selector", index = 3, old = 6, new = 5 },
  { label = "Horde Rats Count Selector", index = 5, old = 5, new = 4 },
  { label = "Horde Rats Count Selector", index = 7, old = 4, new = 3 },
]

rewires = [
  # Invasive Blast's count store reads the switch instead of its own table;
  # outside a Horde trigger the switch hands back that same table.
  { trigger = '[Value Selector] Hero_Piper\Skill Defense Spawn Pets\Skill Defense Spawn Pets Max Count Selector', action = "Horde Rats Count Switch", exact = true, within = "Skill Defense Spawn Pets Count Operation Store", within_span = 400 },
  # Horde's controller and both rat selectors -> the new state.
  { trigger = '[State] Hero_Piper\Skill Trait More Controllable Pets\Skill Trait More Controllable Pets', action = "Horde Attacks State", exact = true, all = true },
  # Horde's card reads its numbers from the 5-slot format above.
  { trigger = '[String Format] Hero_Piper\Skills\Skill String Desc Trait More Controllable Pets', action = "Skill String Desc Horde Rats", exact = true },
  # Only the BASIC attack shot goes through Horde's notify.
  { trigger = '[State] Hero_Piper\Ability Common\Event Attack Shoot Active', action = "Horde Basic Attack Shoot", exact = true, within = "Event Basic Attack Shoot Active", within_span = 300 },
]

[[content]]
kind   = "skill"
id     = "horde_rats_text"
hero   = "Piper"
mode   = "relabel"
source = "Skill_Trait_More_Controllable_Pets"

# Written like the shipped cards: every number is a placeholder (see the
# `Skill String Desc Horde Rats` note above), `&..~` for values that grow with
# rarity, `#..@` for fixed ones and ability keywords.
description = "• For every #{1}@ notes played with #ATTACK@, summon &{0}~ rats that immediately attack nearby enemies\n• Rats spawn in groups of #{2}@ (instead of {3})\n• Increase maximum controllable rats by &{4}~"

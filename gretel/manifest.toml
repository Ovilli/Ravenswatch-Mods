[mod]
id           = "gretel"
name         = "Gretel, the Witch Hunter"
version      = "0.1.0"
author       = "RSMM"
description  = "A new hero: Gretel, who pushed the witch into the oven, stole her wand and founded Ravens Watch. Built on Beowulf's kit (blade, shield, fire), re-cast as the oven's fire bound in the witch's wand. Every ability and talent card is hers (names and text), with new effects: releasing her shield (Oven Door) and a Cinder Spin kill send out a shockwave; talents Slam the Door, Hunter's Pursuit (shockwaves) and Siblings' Oath (clears her other cooldowns). ALL ART STILL BORROWED FROM BEOWULF IS PINK (body, gear, companion, skins, icons, portraits, book pictures), and her story pages and skin names read as placeholders: whatever is pink is what the art team still has to make. Beowulf keeps all of his. For testing, every run grants 5000 XP and her three new talents (turn off in the config; only when playing Gretel). Enable unlock-heroes too."
enabled      = true
load_order   = 95
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes"]
multiplayer_scope = "local-only"
experimental = true

[[content]]
kind        = "hero"
id          = "Gretel"
base        = "Beowulf"
name        = "Gretel"
# Every piece of art still borrowed from Beowulf is painted pink: whatever is
# pink in game is what the art team still has to make.
placeholder = "art/pink.png"
description = "Captured as a child, Gretel pushed the witch into her own oven, stole her wand and freed her brother Hansel. Years later the siblings founded Ravens Watch to hunt the monsters that prey on the helpless. At 55, the wand's magic keeps her as quick and hardy as ever, and the nightmare crisis calls her to defend Reverie once more."

# -- New abilities (rsmm ability-editor builds these steps) -------------------
# Oven Door: releasing the shield slams it shut and sends out a shockwave.
[[content.abilities]]
add_link = "Event Defensive Ability Attack Active.activates"
to = "Primary Ability Effect Spawner"

# Cinder Spin: a kill with the Whirlwind releases a shockwave. Beowulf's
# whirlwind-kill event fires and triggers nothing; Gretel's does.
[[content.abilities]]
add_link = "Event On Secondary Ability Character Killed.activates"
to = "Primary Ability Effect Spawner"

# -- New talent effects (each keeps its original effect) ----------------------
# Slam the Door (Retaliation): the first retaliation strike sends a shockwave.
[[content.abilities]]
add_link = "Event Skill Attack Flurry Active 1.activates"
to = "Primary Ability Effect Spawner"

# Hunter's Pursuit (Fiery Slash): the attack after a dash sends a shockwave.
[[content.abilities]]
add_link = "Event Skill Dash Attack Active.activates"
to = "Primary Ability Effect Spawner"

# Siblings' Oath (Battle Cry): also clears her other cooldowns.
[[content.abilities]]
add_link = "Event Skill Trait Battlecry Active.activates"
to = "Event Trait Ability Clear Other Cooldowns"

# -- Her cards: every ability and talent (Beowulf keeps his). Keep the {N}
# and #...@ tokens in the same order: the numbers come from each card's
# String Format, the tokens are the game's keywords and highlights. ---------

# Abilities
[content.skills."Ability Attack"]
name        = "Hunter's Blade"
description = "• Chain together a series of attacks with the blade. Last attack deals #+{0}%@ damage\n• Whole combo deals a total of &{1}~ damage"

[content.skills."Ability Power"]
name        = "Scorching Wave"
description = "• Drag the blade across the floor to send a scorching wave that deals &{0}~ damage along its path\n• #+WYRM@: Deals #+{1}%@ damage and applies #IGNITE@ to all enemies hit"

[content.skills."Ability Special"]
name        = "Cinder Spin"
description = "• Spin with the blade, briefly becoming #INTANGIBLE@ and dealing &{0}~ damage all around, then finish with a swing that deals &{1}~ damage all around\n• #+WYRM@: Deals #+{2}%@ damage and the finisher applies #IGNITE@ to all enemies hit\n• Killing an enemy with it releases a #POWER@ shockwave"

[content.skills."Ability Defense"]
name        = "Oven Door"
description = "• Hold to raise the oven door and block all incoming damage. Release to slam it shut, dealing &{0}~ damage and sending out a #POWER@ shockwave\n• #+WYRM@: Deals #+{1}%@ damage. Each attack blocked heals all nearby Heroes by #{2}%@ of damage blocked"

[content.skills."Ability Trait"]
name        = "The Witch's Wand"
description = "• Call the fire bound in the witch's wand to empower the next #POWER@, #SPECIAL@ or #DEFENSE@"

[content.skills."Ability Ultimate 1"]
name        = "The Oven's Wrath"
description = "• The wand's fire takes wing and tracks enemies, breathing flame all along its flight, dealing &{0}~ damage per second and applying #IGNITE@ to all enemies hit\n• #TRAIT@ is disabled during this time"

[content.skills."Ability Ultimate 2"]
name        = "Hunter's Fury"
description = "• Rush forward, then chain together a series of attacks with the blade and the wand's fire, dealing up to &{0}~ damage\n• {1} is #INTANGIBLE@ during the whole ability"

# Ultimate choices
[content.skills."Ultimate Power 1"]
name        = "The Oven's Wrath"
description = "• The wand's fire takes wing and flies around, continuously breathing flame\n• Deals damage and applies #IGNITE@ to all enemies hit. {0} can act at the same time"

[content.skills."Ultimate Power 2"]

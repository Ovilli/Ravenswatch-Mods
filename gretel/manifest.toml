[mod]
id           = "gretel"
name         = "gretel"
version      = "0.1.0"
author       = "Indiano_Jones"
description  = "Gretel, a hero built by Indiano_Jones: Hansel's moves, her own look."
enabled      = true
load_order   = 94
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing", "heroes"]
multiplayer_scope = "deterministic-shared"
experimental = true
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind        = "hero"
id          = "Gretel"
base        = "Geppetto"
name        = "Gretel"
description = "Gretel, a hero built by Indiano_Jones: Hansel's moves, her own look."
model       = "art/_Gretel_Model.glb"
albedo      = "art/Gretel_Diffuse.png"
mra         = "art/Gretell_Metal_Rough_AO.png"
normal      = "art/Gretel_Normals.png"
# One PNG for the select-screen portraits and the in-run portrait (none yet).
# portrait    = "art/portrait.png"

# Her mesh is weighted to Geppetto's full export skeleton, but his body only
# skins to a subset (the arms bend on the .SCALE bones, not TopArm/BotArm).
# Each stray bone goes to the body bone that moves with it.
[content.transform]
skin      = "gltf"
submeshes = "map"

[content.transform.bones]
"DEF.TopArm.L"        = "DEF.TopArm.SCALE.L"
"DEF.TopArm.R"        = "DEF.TopArm.SCALE.R"
"DEF.TWIST.TopArm.R"  = "DEF.TopArm.SCALE.R"
"DEF.BotArm.L"        = "DEF.BotArm.SCALE.L"
"DEF.BotArm.R"        = "DEF.BotArm.SCALE.R"
"DEF.SpineMiddle"     = "DEF.SpineMiddle.SCALE"
"DEF.SpineIsolateTop" = "DEF.SpineMiddle.SCALE"
"DEF.Pelvis"          = "DEF.SpineHips"
"DEF.RootMotion"      = "DEF.SpineHips"
"DEF.HealthBarAttach" = "DEF.SpineHips"
"DEF.Index03.R"       = "DEF.Index02.R"
"DEF.Middle03.R"      = "DEF.Middle02.R"
"DEF.Little03.R"      = "DEF.Little02.R"
"DEF.PuppetHead"      = "DEF.PHY.PuppetHead"

# Her effects, violet. Every effect in Piper's own FX folder is copied under
# Nyx_<name> and recoloured; Piper keeps hers.
[content.effects."*"]
tint = "#8a5cff"    


# Throwaway bisect for "right stick aim lost with piper-horde-rats" (2026-10-23).
# No loader flag, no Lua: content only. Enable ONE piper-aim-bisect-* at a time (and not piper-horde-rats), play Piper
# on a controller, and check whether the right stick still aims basic attacks.

[mod]
id          = "piper-aim-bisect-a1a"
name        = "Piper aim bisect A1A"
version     = "0.1.0"
author      = "Ovilli"
license     = "MIT"
description = "ONLY the copied Ghost Notes counter, renamed to new event names (HORDE_ATTACKS_COUNTER_INC/DEC). No loader flag, no Lua."
sdk_version = "3"
enabled     = false
tags        = ["piper", "test"]
experimental = true
multiplayer_scope = "deterministic-shared"

[[content]]
kind = "talent"
id   = "horde_rats_wiring"
hero = "Piper"
file = "Hero_Piper.entity"

clone_nodes = [
  { source = "Skill Attack Ghost Notes Counter", name = "Horde Attacks Counter", rename = [
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC", to = "HORDE_ATTACKS_COUNTER_INC" },
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_DEC", to = "HORDE_ATTACKS_COUNTER_DEC" },
  ] },
]

# Selector values sit at odd union indices, highest rarity first, common last.


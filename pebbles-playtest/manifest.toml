#:schema https://docs.rsmm.me/manifest.schema.json

[mod]
id          = "pebbles-playtest"
name        = "Little Thumb Pebbles (playtest)"
version     = "0.1.0"
author      = "RSMM"
summary     = "Playtest for the item [[content.steps]] fix: crit on hit for 5 s, not forever"
description = "Boris's Little Thumb Pebbles rebuilt with graph steps so the crit bonus lasts 5 seconds after a hit instead of stacking for the whole run. init.lua grants the item at run start and logs crit chance."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = ["gameplay", "item"]
license     = "MIT"
multiplayer_scope = "deterministic-shared"
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind              = "item"
id                = "Increase_Crit_M"
base              = "Increase_Shield"
name              = "Little Thumb Pebbles"
description       = "After taking damage, gain #+{0}%@ #Crit Chance@ for #5@ seconds"
rarity            = "Common"
# Without this the copy keeps Increase_Shield's identity GUID, and a grant by
# GUID (R.give, the engine's own owned-set) hands out the vanilla shield.
unique_identity   = true
value_patches     = [
    ["Shield Value", 1.0, 0.3],
    ["Shield Reload Delay", 30.0, 5.0],
]
# The original item had no super effect; drop the base's healing bonus.
super_effect      = false

# How the crit lasts 5 s: copied from the shipped Dash_Crit_Chance, the proven
# "+X crit for N seconds" item. Its tester (kept running by State Picked Up)
# holds the crit modifier on while its timer has time left; the hit restarts
# that timer. Two earlier attempts hung the bonus on a STATE, and it lasted
# ~1.5 s either way (playtest 2026-10-20).
[[content.steps]]
clone  = ["Crit Chance Modifier Active Tester", "Crit Chance Modifier Timer", "Crit Chance Modifier"]
from   = "Objects/Magical_Objects/Common/Dash_Crit_Chance"
suffix = " Pebbles"
[[content.steps]]
add_link = "State Picked Up.while_active"
to       = "Crit Chance Modifier Active Tester Pebbles"
# The hit restarts the timer (off then on, as On Dash Event does) instead of
# granting the shield's permanent modifier.
[[content.steps]]
remove_link = "On Damage Received.activates[1]"
[[content.steps]]
add_link = "On Damage Received.deactivates?"
to       = "Crit Chance Modifier Timer Pebbles"
[[content.steps]]
add_link = "On Damage Received.activates"
to       = "Crit Chance Modifier Timer Pebbles"
# 5 s and +30%, from the item's own numbers (the card reads the same two).
[[content.steps]]
link = "Crit Chance Modifier Timer Pebbles.duration"
to   = "Shield Reload Delay"
[[content.steps]]
link = "Crit Chance Modifier Pebbles.amount"
to   = "Shield Value"
[[content.steps]]
link = "Descripton Format.obj_4[0]"
to   = "Shield Value"
# Increase_Shield's card shows its number plain (a shield amount); 0.3 printed
# as "+0%". Show this slot x100 as a percentage instead.
[[content.steps]]
percent = "Descripton Format.obj_4"
value   = true

[mod]
id          = "modifier-write-probe"
name        = "Modifier Write Probe"
version     = "0.1.0"
author      = "RSMM"
description = "Diagnostic. Reads the run's global values through R.game, then writes two run modifiers through the engine's own setter (No minimap, Global Xp Modifier = 2) and logs whether each write read back. Solo only: the SDK refuses a replicated value in co-op."
enabled     = true
load_order  = 90
sdk_version = ">=3.0,<4"
license     = "MIT"

tags = ["diagnostic", "modifiers"]

# Writes a run value that the engine replicates, which the SDK only allows when
# the run is provably solo. Test it alone.
multiplayer_scope = "local-only"

[[experiment]]
id       = "reader"
question = "does `rsmm log --grep modifier-write` show a real 'current_chapter' (not nil) and the modifiers you ticked in Custom Mode reading as active?"

[[experiment]]
id       = "write_lands"
question = "do both writes log 'read back OK', and does the minimap disappear during the run?"

[[experiment]]
id       = "xp_effect"
question = "with Global Xp Modifier set to 2, do levels come noticeably faster than a normal run?"

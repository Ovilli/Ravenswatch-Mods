[mod]
id          = "bounty-board"
name        = "Bounty Board"
version     = "1.0.0"
author      = "RSMM"
summary     = "Rotating combat bounties during a run — slay, rampage, go untouched, loot — paid in shards, rerolls, talent upgrades and mystery items."
description = "A live board of three bounties that refreshes all run long: kill 20 before the clock runs out, chain 6 kills in 8 seconds, kill 10 without taking a hit, open chests, level up, win a world event. Each pays out on the spot (dream shards, offer rerolls, a talent upgrade), a streak of three earns a mystery item, and every boss fight posts a special bounty: beat it without falling for a talent upgrade and a revive token. Pick Relaxed, Standard or Brutal from the overlay."
enabled     = true
load_order  = 60
sdk_version = ">=3.0,<4"
# Pure event logic: counts what the gameplay bus reports and pays through the
# game's own reward events. Each peer runs its own board from its own view —
# team kills count for everyone, hits taken only for you — and every payout
# goes to the local hero, so nothing needs to agree across machines.
multiplayer_scope = "deterministic-shared"
license     = "MIT"
tags = ["combat", "events", "rewards", "hud"]

# The board. Shape is declared here; rows come from R.overlay.publish.
[overlay]
title     = "Bounties"
icon      = "trophy"
highlight = "done"
empty     = "The board opens when a run starts."
controls  = ["difficulty"]

[[overlay.columns]]
key = "bounty"
label = "Bounty"
type = "text"

[[overlay.columns]]
key = "progress"
label = "Progress"
type = "bar"

[[overlay.columns]]
key = "count"
label = ""
type = "text"

[[overlay.columns]]
key = "time"
label = "Time"
type = "text"

[[overlay.columns]]
key = "reward"
label = "Reward"
type = "text"

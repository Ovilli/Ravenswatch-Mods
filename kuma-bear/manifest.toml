[mod]
id                = "kuma-bear"
name              = "Kuma the Bear"
version           = "0.1.0"
author            = "Local"
description       = "Kintaro's bear Kuma turns up in the Dark Hills as an elite enemy: Kuma's body and animations, a leap slam, a claw flurry and a bite, and more health than an Alpha."
license           = "MIT"
sdk_version       = ">=3.0,<4"
enabled           = true
multiplayer_scope = "deterministic-shared"
tags              = ["enemy", "kintaro"]
# `ai` and `reskin` build the enemy an entity of its own; not proven in game yet.
experimental      = true
# init.lua spawns Kuma beside the hero as each chapter starts (testing).
loader_flags      = ["RSMM_ENABLE_HERO_CAPTURE"]

# An Alpha wolf's def, entity and AI, copied. The wolf family is the base because
# it is a four-legged melee rig with a leap, a slash combo and a bite, which line
# up with Kuma's own moves. A def loads only on maps that list its tribe, and the
# wolves fight only in Avalon (chapter 2), so Kuma joins the Undead Hogs: he loads
# from the first chapter, Dark Hills, and its hog camps may pick him too.
[[content]]
kind  = "enemy"
id    = "Kuma"
base  = "Elite_Wolf_Alpha"
tribe = "Undead_Hogs"

# Kuma's attacks, best first: each fires when its own condition passes
# (range, cooldown), the first that does wins, and a shared cooldown spaces
# them out. Four are the wolf family's own (the bite is the timber wolf's, the
# Alpha has none; the howl is the Alpha's, here a roar that summons nothing);
# three are new, copied from a wolf attack below with Kuma's own moves.
[content.ai]
attacks = [
    "Attack Giant Leap",     # leap slam
    "Attack Belly Slam",     # new: fish slam, a short hop with a wide landing
    "Attack Howl",           # roar
    "Attack Sumo Stomp",     # new: dohyo stomp
    "Attack Double Slash",   # claw flurry
    "Attack Clap",           # new: nekodamashi clap
    "Attack Bite",           # grab and hold
]
attack_best = 2.5
attack_max  = 4.0
leash       = 50

[content.ai.values]
"Raw Max Health"                       = 250   # the wolf model's 100
"Collision Radius"                     = 1.6   # 1.2: Kuma is bigger
"Attack Giant Leap Radius Value"       = 4.5   # 3.5: a heavier slam
"Attack Giant Leap Max Jump Distance Value" = 12
"Attack Bite Damage Multiplier Value"  = 0.6   # 0.4
"Move Locomotion Max Speed"            = 3.5   # 4: heavier, a little slower

# New attacks: a copy of a wolf attack (its own state, condition, cooldown and
# hit) with Kuma's animation. `animations` and `values` name the SOURCE's parts.
[[content.ai.new_attacks]]
name = "Attack Belly Slam"
from = "Attack Giant Leap"
animations = { "Attack Giant Leap Anim" = "Characters\\Heroes\\Kintaro\\Animations\\Kintaro_Bear_FishSlam_Ultimate1_In.fbx" }
values = { "Attack Giant Leap Radius Value" = 6, "Attack Giant Leap Min Jump Distance Value" = 2, "Attack Giant Leap Max Jump Distance Value" = 6, "Attack Giant Leap Jumping Distance Nominal Value" = 4 }

[[content.ai.new_attacks]]
name = "Attack Sumo Stomp"
from = "Attack Double Slash"
animations = { "Attack Double Combo Anim" = "Characters\\Heroes\\Kintaro\\Animations\\Bear_Kintaro_Dohyo.fbx", "Attack Simple Slash First Attack Anim" = "Characters\\Heroes\\Kintaro\\Animations\\Bear_Kintaro_BasicAttack02.fbx" }
values = { "Attack Double Slash Traverser Base Radius Value" = 4.5 }

[[content.ai.new_attacks]]
name = "Attack Clap"
from = "Attack Double Slash"
animations = { "Attack Double Combo Anim" = "Characters\\Heroes\\Kintaro\\Animations\\Bear_Kintaro_Nekodamashi.fbx", "Attack Simple Slash First Attack Anim" = "Characters\\Heroes\\Kintaro\\Animations\\Bear_Kintaro_BasicAttack02.fbx" }

# Kuma's body and animations in place of the wolf's. Hit timings stay the
# wolf's (they are data on each animation component, not in the FBX), so a
# bear move stands in for the wolf move of the same role.
[content.reskin]
"Characters\\Enemies\\Wolves\\Wolf_Alpha_GEO.fbx"                    = "Characters\\Heroes\\Kintaro\\Kintaro_Bear_GEO.fbx"
"Characters\\Enemies\\Wolves\\Textures\\M_WolfAlpha.mat.ot"          = "Characters\\Heroes\\Kintaro\\Textures\\M_KintaroBear.mat.ot"

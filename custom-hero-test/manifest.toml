[mod]
id           = "custom-hero-test"
name         = "TEST: custom hero (Nyx)"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test for a hero of its own. HUGE DEFENSIVE: her blast is 6x Piper's size and deals damage (x50). NEW ABILITIES: dashing spawns a rat (Rat Dash); a kill with her flute solo (primary) summons a rat (Feast); her defensive blast also drops her secondary zone (Echo Zone). Piper must keep none of these. Each piece is visible: Nyx has her own painted art (midnight-violet starred cloak, silver hair, moon-pale skin), a SILVER flute, her own portrait and VIOLET effects; her DASH spins her spine (Piper's dash must stay normal); all nine skin slots are her outfits (Frost, Moss with the Poison body shape, Eclipse, Ember, Nebula, Bone, Abyss, Dusk, Aurora); her Rat King ultimate recharges in 5 s and she spawns 6 rats; her day notes look like Juliet's bullets. Earlier summary: Nyx, built on Piper, with her own gameplay entity family (Hero_Nyx*), her own alias, her own body mesh and a MAGENTA body texture, and her own name. Pass: a 13th hero named Nyx on the select screen; picking her shows a magenta Piper; a run plays with Piper's abilities (rats, notes) working. Enable unlock-heroes too."
enabled      = true
load_order   = 94
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing", "heroes"]
multiplayer_scope = "local-only"
experimental = true

[[content]]
kind        = "hero"
id          = "Nyx"
base        = "Piper"
name        = "Nyx"
description = "A test hero built by rsmm: Piper's moves, her own look."
model       = "art/nyx.glb"
# Her art, painted from Piper's own maps (region recolour, shading kept):
# midnight-violet starred cloak, silver hair, plum leather, moon-pale skin.
albedo      = "art/nyx_alb.png"
# One PNG for the select-screen portraits and the in-run portrait.
portrait    = "art/portrait.png"

# A weapon of her own (label = the base's graphic object, see export-character).
[content.weapons."Weapon In Left Hand Mesh"]
model  = "art/flute.glb"
albedo = "art/flute_silver.png"

# Her effects, violet. Every effect in Piper's own FX folder is copied under
# Nyx_<name> and recoloured; Piper keeps hers.
[content.effects."*"]
tint = "#8a5cff"

# Her own dash: only Nyx plays it, Piper keeps hers.
[content.animations.Piper_Dash_Default]
source = "art/spin.glb"
clip   = "a"

# Outfits fill skin slots 1..9 in order. NINE IS THE LIMIT: Piper has Default
# plus nine skins, and the engine's skin roster is a hard-coded nine - a tenth
# outfit would have no slot to take.
[[content.outfits]]
name   = "Frost"
albedo = "art/outfit_frost.png"

[[content.outfits]]
name   = "Moss"
model  = "art/moss_body.glb"     # a body of its own (Piper's Poison skin shape)
albedo = "art/outfit_moss.png"

[[content.outfits]]
name   = "Eclipse"
albedo = "art/outfit_eclipse.png"

[[content.outfits]]
name   = "Ember"
albedo = "art/outfit_ember.png"

[[content.outfits]]
name   = "Nebula"
albedo = "art/outfit_nebula.png"

[[content.outfits]]
name   = "Bone"
albedo = "art/outfit_bone.png"

[[content.outfits]]
name   = "Abyss"
albedo = "art/outfit_abyss.png"

[[content.outfits]]
name   = "Dusk"
albedo = "art/outfit_dusk.png"

[[content.outfits]]
name   = "Aurora"
albedo = "art/outfit_aurora.png"

# Her numbers (rsmm export-character Piper --list-values): a 5 s Rat King
# cooldown and 6 rats per spawn instead of 2.
[content.values]
"Ultimate Power 2 Cooldown Max" = 5
"Trait Ability Pets Per Spawn Default Amount" = 6

# Her day notes fly as Juliet's bullet trail.
[content.references]
"Settings\\Heroes\\Hero_Piper_FX\\Piper_Note_Day_01.vfx.ot" = "Settings\\Heroes\\Hero_Juliet_FX\\Juliet_Basic_Bullet_Trail_01.vfx.ot"

# New abilities (rsmm ability-editor builds these steps). Each one is visible:
# Rat Dash: dashing spawns a rat.
[[content.abilities]]
add_link = "Child State Dash Ability.activates"
to = "Event Trait Ability Spawn One Pet"

# Feast: a kill with her primary (the flute solo) summons a rat. Piper's
# kill event fires and triggers nothing; Nyx's triggers the one-rat spawn.
[[content.abilities]]
add_link = "Event On Primary Ability Character Killed.activates"
to = "Event Trait Ability Spawn One Pet"

# Echo Zone: her defensive blast also drops a copy of her secondary zone, from
# a cloned ability of her own ("Echo") so her real secondary is untouched.
# DISABLED 2026-09-26: suspect for a crash 2 s into a Nyx run (NamedEvent_Dispatch
# reading -1 during the level-up burst of the XP grant). The copy includes a
# cloned MASTER_DESTROY named-event SENDER. Re-enable once cleared.
# [[content.abilities]]
# clone = "Ability Secondary"
# as = "Echo"
#
# [[content.abilities]]
# add_link = "Event Defensive Ability Active.activates"
# to = "Event Secondary Ability Activate Echo"

# Huge defensive: Piper's blast (radius 5) goes to 30 - six times the size,
# its effect scales with it - and it DEALS DAMAGE. Piper's blast only pushes
# (its damage multiplier is 0 unless the Defensive Deals Damage talent is
# taken, which gives 4..7); Nyx's reads a multiplier of 50 of her own.
[[content.abilities]]
set = "Defensive Ability Attack Radius.value"
value = 30

[[content.abilities]]
clone = ["Defensive Ability Attack Pushback"]
suffix = " Nyx Blast Damage"

[[content.abilities]]
set = "Defensive Ability Attack Pushback Nyx Blast Damage.value"
value = 50

[[content.abilities]]
link = "Defensive Ability Attack Damage Enemies.value_28"
to = "Defensive Ability Attack Pushback Nyx Blast Damage"

# CRESCENT CROSS: her special, entirely her own. She chops, then sweeps; her
# own crescent-moon blades fly out forward and back, then left and right, in
# a cross. The blade is an entity of hers (Hero_Nyx_Crescent) on the engine's
# generic hero projectile, with her own mesh, maps, trail and impact (her
# violet effects) and her own cast animation. Piper's zone is gone.
[[content.attacks]]
id        = "Crescent"
slot      = "special"
model     = "art/crescent.glb"
albedo    = "art/crescent_alb.png"
mra       = "art/crescent_mra.png"
normal    = "art/crescent_nrm.png"
speed     = 16
lifetime  = 0.9
beats     = [[0, 180], [90, -90]]
delay     = 0.4
animation = "art/cast.glb"
clip      = "cast"

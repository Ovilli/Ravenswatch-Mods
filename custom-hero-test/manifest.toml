[mod]
id           = "custom-hero-test"
name         = "TEST: custom hero (Nyx)"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test for a hero of its own. NEW ABILITIES: dashing spawns a rat (Rat Dash); a kill with her flute solo (primary) summons a rat (Feast); her defensive blast also drops her secondary zone (Echo Zone). Piper must keep none of these. Each piece is visible: Nyx is MAGENTA with a GOLD flute; her DASH spins her spine (Piper's dash must stay normal); skin slots 2 and 3 are outfits Frost (cyan) and Moss (green, Mercenaries body shape); her Rat King ultimate recharges in 5 s and she spawns 6 rats; her day notes look like Juliet's bullets. Earlier summary: Nyx, built on Piper, with her own gameplay entity family (Hero_Nyx*), her own alias, her own body mesh and a MAGENTA body texture, and her own name. Pass: a 13th hero named Nyx on the select screen; picking her shows a magenta Piper; a run plays with Piper's abilities (rats, notes) working. Enable unlock-heroes too."
enabled      = true
load_order   = 94
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing", "heroes"]
multiplayer_scope = "local-only"
experimental = true

[[content]]
kind        = "hero"
id          = "Nyx"
base        = "Piper"
name        = "Nyx"
description = "A test hero built by rsmm: Piper's moves, her own look."
model       = "art/nyx.glb"
albedo      = "art/alb.png"

# A weapon of her own (label = the base's graphic object, see export-character).
[content.weapons."Weapon In Left Hand Mesh"]
model  = "art/flute.glb"
albedo = "art/gold.png"

# Her own dash: only Nyx plays it, Piper keeps hers.
[content.animations.Piper_Dash_Default]
source = "art/spin.glb"
clip   = "a"

[[content.outfits]]
name   = "Frost"
albedo = "art/cyan.png"

[[content.outfits]]
name   = "Moss"
model  = "art/moss_body.glb"     # a body of its own (Piper's Mercenaries shape)
albedo = "art/green.png"

# Her numbers (rsmm export-character Piper --list-values): a 5 s Rat King
# cooldown and 6 rats per spawn instead of 2.
[content.values]
"Ultimate Power 2 Cooldown Max" = 5
"Trait Ability Pets Per Spawn Default Amount" = 6

# Her day notes fly as Juliet's bullet trail.
[content.references]
"Settings\\Heroes\\Hero_Piper_FX\\Piper_Note_Day_01.vfx.ot" = "Settings\\Heroes\\Hero_Juliet_FX\\Juliet_Basic_Bullet_Trail_01.vfx.ot"

# New abilities (rsmm ability-editor builds these steps). Each one is visible:
# Rat Dash: dashing spawns a rat.
[[content.abilities]]
add_link = "Child State Dash Ability.activates"
to = "Event Trait Ability Spawn One Pet"

# Feast: a kill with her primary (the flute solo) summons a rat. Piper's
# kill event fires and triggers nothing; Nyx's triggers the one-rat spawn.
[[content.abilities]]
add_link = "Event On Primary Ability Character Killed.activates"
to = "Event Trait Ability Spawn One Pet"

# Echo Zone: her defensive blast also drops a copy of her secondary zone, from
# a cloned ability of her own ("Echo") so her real secondary is untouched.
[[content.abilities]]
clone = "Ability Secondary"
as = "Echo"

[[content.abilities]]
add_link = "Event Defensive Ability Active.activates"
to = "Event Secondary Ability Activate Echo"

# TEST — validates the typed `level_up` hook (Event_LevelUp) after Update 6.
#
# Logs every typed level_up with its {level}, and the two independent signals
# for the same moment (analytics levelup_run.level_up_reach and gameplay
# HERO_XP_LEVEL_UP), so one run shows whether the hook fires, fires ONCE per
# level-up, and reports the right level. Play a run and level up a few times.
#
# `rsmm log | grep level-up-test`
[mod]
id          = "level-up-test"
name        = "Level Up Test"
version     = "0.1.0"
author      = "test"
description = "TEST: checks the typed level_up event against the analytics and gameplay level-up signals."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = []
license     = ""

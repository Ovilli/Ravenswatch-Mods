# Defaults are the game's own values (ApplicationSettings.ot), so an
# untouched config changes nothing. Boss wakes after
#   half-cycles x (day + night) / 2 + overtime   seconds (21 min shipped).

[fields.ch1_day]
type    = "float"
default = 180.0
min     = 10.0
max     = 3600.0
label   = "Chapter 1: Day length (seconds)"

[fields.ch1_night]
type    = "float"
default = 180.0
min     = 10.0
max     = 3600.0
label   = "Chapter 1: Night length (seconds)"

[fields.ch1_half_cycles]
type    = "int"
default = 6
min     = 0
max     = 40
label   = "Chapter 1: Half-cycles before the boss wakes"

[fields.ch1_overtime]
type    = "float"
default = 180.0
min     = 0.0
max     = 3600.0
label   = "Chapter 1: Overtime before the boss is forced (seconds)"


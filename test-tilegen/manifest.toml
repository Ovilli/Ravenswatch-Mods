[mod]
id           = "test-tilegen"
name         = "TEST: busier Dark Hills"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. Dark Hills camps may only use 64x64 slots (40x40 off). Pass: rsmm log --grep tilegen-proof counts 0 camps named 40x40_* in Dark Hills (every unedited map so far had several)."
enabled     = true
load_order   = 30   # below runestone-shrine (31): R.poi has one owner per launch
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind    = "tilegen"
id      = "test_camps"
chapter = "DarkHills"
[content.kinds.Camp]
count = 2
footprints = { "40x40" = false }
[content.quotas]
Wishing_Well = 2

[mod]
id           = "test-tilegen"
name         = "TEST: busier Dark Hills"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. Camp forbidden in every Dark Hills 40x40 SLOT (per-slot allow mask; kind count/footprints proved ineffective 2026-09-24). Pass: rsmm log --grep tilegen-proof reports 40x40=0 camps (vanilla ~5)."
enabled     = true
load_order   = 30   # below runestone-shrine (31): R.poi has one owner per launch
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"
experimental = true

# 2026-09-24 experiment: kind count/footprints are loaded but NOT honoured
# (live Camp count read 2, 8 camps placed incl. five 40x40). Test the
# per-slot allow mask instead: Camp forbidden in every 40x40 slot.
# PASS = zero 40x40 camps (vanilla places ~5).
[[content]]
kind    = "tilegen"
id      = "test_camps"
chapter = "DarkHills"

[content.slots]
"30" = { pos = [-56.0, 8.0, 147.0], allow = { Camp = false } }

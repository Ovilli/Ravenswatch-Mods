[mod]
id           = "test-tilegen"
name         = "TEST: busier Dark Hills"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. Dark Hills: Camp kind count 2 and NO fill on the 40x40/64x64 groups (the fill pass is where most camps come from). Pass: rsmm log --grep tilegen-proof reports 2 or fewer camps (vanilla 8-9)."
enabled     = false
load_order   = 30   # below runestone-shrine (31): R.poi has one owner per launch
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"

# 2026-09-24. The kind count and slot masks proved ineffective in two playtests,
# and TileSpawn_PlaceTiles says why: after the per-kind pass, every footprint
# group with a flag filter fills each still-empty slot with a tile carrying
# those flags, and the 40x40/64x64 groups fill with "Camp". So: place 2 camps in
# the kind pass, and switch that fill off. PASS = at most 2 camps.
[[content]]
kind    = "tilegen"
id      = "test_camps"
chapter = "DarkHills"

[content.kinds.Camp]
count = 2

[content.fill]
"40x40" = []
"64x64" = []

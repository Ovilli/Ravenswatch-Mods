[mod]
id = "wolf-summon-test"
name = "Wolf Summon Test"
version = "0.1.0"
author = "Ovilli"
description = "Scarlet clone whose special summons a chapter 3 timber wolf that fights for her."
sdk_version = ">=3.0,<4"
multiplayer_scope = "deterministic-shared"
tags = ["hero"]
license = "MIT"
enabled = true

[[content]]
kind = "hero"
id = "WolfCaller"
base = "Red"
name = "Wolf Caller"
description = "Her special calls a timber wolf to fight at her side."

[content.kit]
# Variants: Standard_Wolf_Timber, Standard_Wolf_Dire, Elite_Wolf_Alpha
special = { replace = false, steps = [ { summon = "Enemies/Wolves/Standard_Wolf_Timber" } ] }

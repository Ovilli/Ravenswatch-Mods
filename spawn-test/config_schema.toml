[fields.probe_only]
label   = "Only log the spawn chain, never call the engine (run this first)"
type    = "bool"
default = true

[fields.enemy]
label   = "Enemy to copy (part of its resource path; empty = the first one found)"
type    = "string"
default = ""

[fields.count]
label   = "How many to spawn"
type    = "int"
default = 1

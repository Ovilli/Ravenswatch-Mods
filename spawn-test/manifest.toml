[mod]
id          = "spawn-test"
name        = "Spawn Test (dev)"
version     = "0.1.0"
author      = "RSMM"
description = "Testing tool for R.spawn: logs the spawn chain, then spawns copies of an enemy the game has already spawned this run, beside the hero."
enabled     = true
load_order  = 90
sdk_version = ">=3.0,<4"
license     = "MIT"
tags        = ["dev", "spawn", "testing"]
# R.spawn refuses on a session client, and what a host spawns is not known to
# reach other players. Test solo.
multiplayer_scope = "local-only"

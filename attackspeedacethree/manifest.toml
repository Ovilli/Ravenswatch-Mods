#:schema https://docs.rsmm.me/manifest.schema.json

[mod]
id          = "attackspeedacethree"
name        = "Ace of Spades: Attack Speed"
version     = "0.1.0"
author      = "Pam"
description = "Ace of Spades gives +75% basic attack speed; its super effect gives +75% attack power."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = ["items", "balance"]
license     = ""

# Edits the shipped Ace of Spades in place (mode = "replace"), so the card in
# the pool is the changed one; no second Ace is added.
[[content]]
kind              = "item"
id                = "Damage_Attack"
base              = "Damage_Attack"
mode              = "replace"
value_patches     = [
    ["Attack Speed Value", 0.15, 0.75],
    ["Damage Value", 0.2, 0.75, true],
]
stats             = { "Modifier" = "Basic Attack Speed", "Super Effect Modifier" = "Attack power" }
super_description = "#DMG@ &+{0}%~"

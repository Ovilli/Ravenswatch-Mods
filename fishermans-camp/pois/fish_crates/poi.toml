# FISH CRATES — where the fish for the fisherman's quest come from.
#
# The reverse of the 3 Pigs straw quest: there the straw house pulls 15 small
# "3Pigs_Material" crate/cart tiles onto the map within 130 m (its tile
# constraints), each spawning straw while the pig's mission asks for it. Here
# the fisherman's hut pulls these tiles in the same way (its `needs`, flag
# Fishermans_Fish_Crates, on the map surface), and each holds a fish pile you
# pick up (ingredient "Fish", the manifest's [[content]] kind = "ingredient").
# You bring the fish down to the giant catch in the platform room.
#
# Base: the game's own straw crate tile, with only its straw spawner removed:
# the crates, planks and the cart wheel stay as the dressing.
base      = "Dark_Hills/6x6_3Pigs_Material_Crates"
chapters  = ["Dark_Hills"]
# Only ever placed by the hut's on-map `needs`, never chosen for a slot.
subtile   = "surface"
kinds     = ["Fishermans_Fish_Crates"]
copies    = 1
own_level = true
clear     = { remove = ["3Pigs_Material_Spawner.entity.ot"] }

# The fish pile stands where the straw spawner stood.
places = [
  { entity = "ingredient:Fish/fish_pile", pos = [1.3, 0.0, -0.3], yaw = 30.0 },
]

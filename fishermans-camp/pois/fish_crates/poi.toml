# FISH CRATES — where the fish for the fisherman's quest come from: a fish
# pile to pick up (ingredient "Fish", the manifest's [[content]] kind =
# "ingredient"), carried down to the giant catch in the platform room.
#
# They ADD to the map and replace nothing: the manifest's tilegen block adds a
# kind of their own (Fishermans_Fish_Crates, 12 per map) and 12 new 6x6 slots
# that allow only that kind — free ground no shipped tile ever used.
#
# Base: the game's own straw crate tile, with only its straw spawner removed:
# the crates, planks and the cart wheel stay as the dressing.
base      = "Dark_Hills/6x6_3Pigs_Material_Crates"
chapters  = ["Dark_Hills"]
# Its kind is the one the manifest's tilegen block ADDS, so the shipped recipe
# does not know it yet: "surface" skips that check (and keeps it a map tile).
subtile   = "surface"
kinds     = ["Fishermans_Fish_Crates"]
copies    = 1
own_level = true
clear     = { remove = ["3Pigs_Material_Spawner.entity.ot"] }

# The fish pile stands where the straw spawner stood.
places = [
  { entity = "ingredient:Fish/fish_pile", pos = [1.3, 0.0, -0.3], yaw = 30.0 },
]

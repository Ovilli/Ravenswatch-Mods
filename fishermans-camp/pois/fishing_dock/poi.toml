# THE FISHING PLATFORM — the fan art's fishing platform as a whole tile of its
# own, after the reference renders: the upper deck at the back (2 m) with the
# tall-roofed hut, the giant fish on its pallet and the blood path, the drying
# rack, the crane and the cloth awnings; the lower walkways (1 m) round an open
# water hole with rope fences, posts and a torn tarp; the cloth tent, the
# broken lean-to, crates and barrels; ramps up to the deck and down to the
# water; everything standing in shallow water. Every binary here is built
# locally from the fan art and gitignored; only this file is shared.
#
# Built as a KIT (one mesh per entity): the hut is the prop (model.glb, it
# carries the minimap icon and the interaction), every other part is its own
# entity under parts/. All are authored in tile coordinates and stand at the
# tile origin. About 1.0 M vertices in 22 meshes, each under the cooker's
# 65535-vertex limit, which is per mesh.
#
# The tile is the Dark Hills ghoul camp with a moat (40x40_Chest_SmallPool): it
# already has water. Its own scenery and its invisible pit walls are cleared,
# its centre is flooded into shallow water, and its reward is lifted onto the
# upper deck. Its ghouls stay.
base      = "Dark_Hills/40x40_Chest_SmallPool_Ghouls_Camp"
chapters  = ["Dark_Hills"]
kinds     = ["Camp"]
# PLAYTEST: 16 (the SDK's cap) next to the chapter's 9 shipped 40x40 Camps, so
# about two 40x40 camps in three are the platform. Lower it once confirmed.
copies    = 16
own_level = true

clear = { walls = true }
move = [
  { entity = "Enemy_Camp_Reward_Spawner_Dark_Hills.entity.ot", pos = [-1.2, 2.0, -9.3] },
  { entity = "LD_Reward_Pedestal.entity.ot", pos = [-1.2, 2.0, -9.3] },
]
terrain = [
  { op = "set", x = 0.0, z = -2.0, radius = 19.0, amount = -1.6, falloff = "smooth", layer = "Height" },
  { op = "set", x = 0.0, z = -2.0, radius = 14.0, amount = -1.6, falloff = "constant", layer = "Height" },
]

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"
transform = { fit = "rig", scale = 1.0 }
interactive = true

# The hut blocks.

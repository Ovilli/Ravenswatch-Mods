# THE FISHING DOCK — the fan art's fisherman camp, built the way the shipped
# Dark Hills docks are: on the game's own High Fisherman Platform (raised
# plank decks at 4 m and 8 m on pontoon pillars, slopes, boats, fishnets), with
# the fan-art pieces stood on its decks as a kit of small parts. Every binary
# here is built locally from the fan art and gitignored; only this file is
# shared.
#
# The shipped docks are KITS: ~100 small entities placed ~470 times, each
# walkable deck carrying its own collision box. Six giant meshes at the tile
# centre (v0.4) drew only the first; one mesh per entity, placed where it
# stands, is the shipped way and the one proven on the hut.
base      = "Dark_Hills/64x64_HighFishermanPlatform_Ghouls_Camp"
chapters  = ["Dark_Hills"]
kinds     = ["Camp"]
# 4 entries next to the chapter's own Camp tiles while it is playtested;
# lower it afterwards.
copies    = 4
own_level = true

# Everything the shipped tile stands stays (decks, slopes, pillars, boats,
# ghouls, the reward on the top deck) except its hut, whose spot ours takes.
clear = { remove = ["Hut.entity.ot"] }

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"
transform = { fit = "rig", scale = 1.0 }
interactive = true

# The hut (model.glb, the prop: it carries the minimap icon and the
# interaction) blocks; the deck under it is the shipped one.
collision = [
  { kind = "wall", size = [4.0, 2.5, 3.0], at = [0.0, 1.25, -0.9] },
]

# Where everything stands. Mid deck top = y 4 (Platform_Floor_8x8_02 floors at
# x -11..13, z 2..18), upper deck = y 8 (reward at -1.4, -19.1). The shipped
# hut stood at (0.4, 3.8, 1.0) on the 8x4 floor at (0.9, 4, 0.1).
places = [
  { entity = "@prop",   pos = [0.4, 4.0, 1.0] },
  { entity = "@catch",  pos = [9.0, 4.0, 10.0],  yaw = 30.0 },
  { entity = "@awning", pos = [12.6, 4.0, 10.5] },
  { entity = "@rack",   pos = [1.0, 4.0, 15.5] },
  { entity = "@rack",   pos = [-7.0, 4.0, 12.5], yaw = 90.0 },
  { entity = "@rack",   pos = [7.0, 8.0, -11.5] },
  { entity = "@stack",  pos = [-2.0, 4.0, 4.5] },
  { entity = "@stack",  pos = [12.0, 4.0, 16.5], yaw = 20.0 },
  { entity = "@stack",  pos = [-9.0, 8.0, -10.5] },
]

# ⚠ Every table header goes below this line.

[slots]
albedo = "Scenery\\DarkHills\\T_Walls_Ruins_ALB.tga"
mra    = "Scenery\\DarkHills\\T_Walls_Ruins_MRA.tga"
normal = "Scenery\\DarkHills\\T_Walls_Ruins_NRM.tga"

[marker]
icon = "icon.png"
reveal_radius = 20000.0

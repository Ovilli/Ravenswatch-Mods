# THE FISHING DOCK — the fan art's fishing platform, built over the moat of a
# Dark Hills ghoul camp: plank bridges on posts with railings across the water,
# the fisherman's hut raised on its deck on the island, and the giant catch on
# a gutting floor. Every binary here is built locally from the fan art and is
# gitignored; only this file is shared.

# The base is the pooled 40x40 "SmallPool" ghoul camp: an island ringed by a
# 4 m deep moat with three crossings, fenced everywhere else by the level's own
# pit walls. The bridges stand exactly on the shipped crossings, so the walls
# still fit. The camp's ghouls and its reward are kept.
base      = "Dark_Hills/40x40_Chest_SmallPool_Ghouls_Camp"
chapters  = ["Dark_Hills"]
kinds     = ["Camp"]
# 4 entries next to the chapter's own Camp tiles: roughly one 40x40 camp in
# five becomes the dock while it is being playtested. Lower it afterwards.
copies    = 4
own_level = true

# Sink the camp's own scenery (rocks, reeds, its plain bridges and pontoons)
# 1000 m under the map; keep the ghoul spawners, the reward and its pedestal.
clear = true

# The whole dock is ONE prop of this mod's, stood at the tile origin.
places = [{ entity = "@prop", pos = [0.0, 0.0, 0.0] }]

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"

# Authored in tile coordinates, in six meshes (model.glb, model_2..6.glb, each
# under the cooker's 65535-vertex cap; the prop draws one graphic component
# per mesh). Scale 1 and no rotation: the collision below is in the same space
# and does not follow the mesh transform.
transform = { fit = "rig", scale = 1.0 }

interactive = true

# WALKABLE: one ground box per bridge (top at y = 0, over the moat), a thin
# wall along each bridge side (the railings), the hut's proven deck, ramp and
# body moved to the island, and the gutting deck (1.0 high) with its ramp and
# its two railings.

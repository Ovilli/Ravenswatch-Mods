# THE FISHING PLATFORM (v3) — the fan art's fishing platform as a whole tile,
# laid out from the reference blockout back-projected to a plan (pitch 38 deg,
# 90 deg FOV, mannequins at 1.8 m; fishermans-camp-tools/scripts/backproject.py
# + layout_ref3.py): the angled upper deck (2.4 m) at the back with the
# tall-roofed hut on its left, the giant fish on the grate in its middle, the
# crane, the drying rack and the torn tarp; a row of posts under its front
# edge dropping into the open water hole; the wide wedge ramp off its
# front-left (under a tarp) and a stair off its front-right; the lower ring
# (0.2 m) as a U round the hole — the left wing with the lean-to, the front
# walkway, the right arm with the niche — and two long ramps into the water.
# Every binary here is built locally from the fan art and gitignored; only
# this file is shared.
#
# Built as a KIT (one mesh per entity): the hut is the prop (model.glb, it
# carries the minimap icon and the interaction), every other part is its own
# entity under parts/, all authored in tile coordinates at the tile origin,
# each under the cooker's 65535-vertex limit.
#
# Collision is ALL axis-aligned (no rot): decks are strips, the ramps are
# staircases of 0.8 m cells (<= 0.4 m per step; a 0.5 m step is proven
# climbable), diagonal railings are chains of overlapping blocks.
base      = "Dark_Hills/40x40_Chest_SmallPool_Ghouls_Camp"
chapters  = ["Dark_Hills"]
kinds     = ["Camp"]
# PLAYTEST: 16 (the SDK's cap) next to the chapter's 9 shipped 40x40 Camps, so
# about two 40x40 camps in three are the platform. Lower it once confirmed.
copies    = 16
own_level = true

clear = { walls = true }
move = [
  { entity = "Enemy_Camp_Reward_Spawner_Dark_Hills.entity.ot", pos = [-1.8, 2.4, -0.6] },
  { entity = "LD_Reward_Pedestal.entity.ot", pos = [-1.8, 2.4, -0.6] },
]
# The whole platform stands in shallow water: the tile is flooded to -1.6 m
# inside 19.5 m of its centre (the ramps end inside that disc).
terrain = [
  { op = "set", x = 0.0, z = 0.0, radius = 19.5, amount = -1.6, falloff = "constant", layer = "Height" },
]

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"
transform = { fit = "rig", scale = 1.0 }
interactive = true

# The hut blocks.
collision = [

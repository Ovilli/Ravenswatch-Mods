# THE FISHING PLATFORM ROOM — the fan art's whole fishing platform, built as an
# UNDERGROUND SUB-TILE the way the game builds its Ghoul den and Thieves' stash
# rooms: it is never chosen for a map slot. The fisherman's hut entrance
# (pois/fishermans_hut) `needs` one tile flagged Fishermans_Platform_Underground,
# so the generator drops this one into one of the map's off-map room slots, and
# the hut's door teleporter brings you here. GENERATED by
# fishermans-camp-tools/scripts/write_poi3.py (layout_ref3 DESTRUCT=1 COL_CELL=0.2):
# edit the script, not this file.
#
# v0.8: the kit stands at scale 2 (each placement's own scale; the
# engine scales collision volumes with a placed entity, as the shipped Gold
# Room's 0.75-scaled Platform_Floor decks rely on — UNPROVEN for this mod).
# The water floor is at room y = 0, where the room's teleporter stands.
#
# Built as a KIT (one mesh per entity, the hut is the prop). Every binary here
# is built locally from the fan art and gitignored; only this file is shared.
base      = "Dark_Hills/DarkHill_Thieves_Stashes_Gold_Room_Underground_01"
chapters  = ["Dark_Hills"]
subtile   = true
kinds     = ["Fishermans_Platform_Underground"]
copies    = 1
own_level = true

# Only the room's lighting zone (ambient, fog) survives; its walls, floor, jars
# and its own teleporter are sunk. `walls`: the Gold Room's six invisible static
# walls (oCStaticWallGo) are not placements, so only this sinks them.
clear = { keep = ["Zone_Render_Setting"], walls = true }

# The room's OWN terrain: the Gold Room's cave (rocks and walls from y -21 to
# +15, 80 x 100 m) poked through the platform. Stretch it over the whole
# 128 x 128 slot, flatten it under the water and raise the water to y = 0.3.
terrain_size = [128.0, 128.0]

# The room's look (ambient light, fog, colour) is the Gold Room's render zone,
# centred at (0, 7.3, 0) and only 34 m wide (16 m vertical): the bigger
# platform walked out of it, and the look snapped back to the outdoor one
# (playtest 2026-11-15). Cover the whole walled room.
# Its ambient light, (0.17, 0.16, 0.18) in the Gold Room: too dark (playtest).
render_ambient = [0.55, 0.52, 0.52]
level_values = { "Render Settings Zone Scale Value" = 88.0, "Render Settings Zone Vertical Scale Value" = 40.0 }
terrain = [
  { op = "set", layer = "Terrain Height", x = 0.0, z = 0.0, radius = 200.0, amount = -0.6, falloff = "constant" },
  { op = "set", layer = "Water Height", x = 0.0, z = 0.0, radius = 1.0, amount = 0.3 },
  # the swamp look of the game's own fisherman platform (64x64_HighFishermanPlatform):
  # brown water, a mud bed, some duckweed; the Gold Room's floor colour had black cave patches
  { op = "tint", layer = "Vertex Color Water", color = "#af6d33", amount = 1.0, x = 0.0, z = 0.0, radius = 200.0, falloff = "constant" },
  { op = "tint", layer = "Vertex Color Terrain", color = "#ffffff", amount = 1.0, x = 0.0, z = 0.0, radius = 200.0, falloff = "constant" },
  { op = "set", layer = "Mud", amount = 0.9, x = 0.0, z = 0.0, radius = 200.0, falloff = "constant" },
  { op = "set", layer = "Water Lentils", amount = 0.2, x = 0.0, z = 0.0, radius = 200.0, falloff = "constant" },
]

# Three ways out, all paired with the hut's door:
#   * the room's own return teleporter (an object `clear` cannot sink), taken
#     over under our pair name; it stands at [4.86, 0.0, 23.0] facing -Z, in the
#     water just in front of the front walkway, and is where you arrive;
#   * one at the foot of each long ramp (yaw = facing back up the ramp,
#     assuming yaw 0 faces +Z — unverified).
teleporters = [
  { side = "in", id = "Fishermans_Platform", replace = "Objects_Common\\Thieves_Underground_Teleporter_In.entity.ot" },
  { side = "in", id = "Fishermans_Platform", pos = [-28.506, 0.0, 15.34], yaw = 138.8 },
  { side = "in", id = "Fishermans_Platform", pos = [28.869, 0.0, 14.427], yaw = -153.4 },
]

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"
transform = { fit = "rig", scale = 1.0 }


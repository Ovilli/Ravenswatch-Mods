# THE FISHERMAN'S HUT — the ENTRANCE to the fishing platform. A log cabin with a
# lantern post, crates, barrels and the day's catch in a Dark Hills clearing,
# marked on the minimap. Its door is a sub-tile teleporter: step up to it and
# you are taken to the fishing platform room (pois/platform_room), built the way
# the game builds its Ghoul den and Thieves' stash rooms.
#
# How the pair finds each other:
#   * `needs` asks the map generator for one tile flagged
#     Fishermans_Platform_Underground (the room), placed in one of the map's
#     off-map room slots — exactly what the Ghoul den entrance does;
#   * the `out` teleporter here and the `in` one in the room share the id
#     Fishermans_Platform;
#   * the Fishermans_Entrance flag is capped at 1 per map (manifest
#     [[content]] tilegen add_quotas): Dark Hills has only 5 room slots and the
#     game's own rooms use up to 4, so a second hut would ask for a room that
#     has nowhere to go.
#
# Every binary in this folder is built locally from the fan art and gitignored;
# only this file and the manifest are shared.

# Base: a 6x6 dream-crystal clearing (one crystal at the centre, flat ground at
# y = 0), CLEARED so the hut stands there instead. The hut and its ramp take
# about 5 x 5.6 m, so it fits the small slot instead of using up a whole 40x40
# `Special` (v0.7 used the Old Shipyard). Dark Hills has no 4x4 slots; 6x6 is
# the smallest that holds the hut (3x3 is too small).
#
# ⚠ UNPROVEN: the v0.7 crystal-clearing attempt that never placed (0 of ~4
# picks) ran before the constraint-encoding fix (the class-table indexes in
# tile_cook.write); the game also ships a 6x6 entrance that pulls an
# underground room (6x6_Stone_Reserve_Entrance_01). If the hut stops showing,
# go back to base = "Dark_Hills/40x40_Old_Shipyard_CrystalField",
# kinds = ["Special"], ground y = 2.0, clear = { walls = true }.
base      = "Dark_Hills/6x6_Crystal_01"
chapters  = ["Dark_Hills"]
# A `Crystal` pick in a 6x6 slot (the kind is 50 picks per map, 3x3 or 6x6).
kinds     = ["Crystal"]
flags     = ["Fishermans_Entrance"]
weight    = 0.0
# PLAYTEST: several pool entries so the hut shows up most runs; the quota
# keeps it to one per map.
copies    = 6
own_level = true
# Sink the clearing's one dream crystal.
clear     = true

needs = [
  { flags = ["Fishermans_Platform_Underground"] },
  # The fish for the quest: 12 fish-crate tiles on the map within 130 m, the
  # way the straw house pulls in its 15 straw crates/carts (pois/fish_crates).
  { flags = ["Fishermans_Fish_Crates"], count = 12, underground = false, max = 130.0 },
]

# The teleporter is on the deck in front of the door (the door faces +Z; deck
# top = ground + 0.5).
teleporters = [
  { side = "out", id = "Fishermans_Platform", pos = [0.0, 0.5, 0.7] },
]

places = [
  { entity = "@prop", pos = [0.0, 0.0, 0.0] },
]

entity_base   = "DarkHills\\SceneryObjects_DarkHills\\Wall_Ruins_Block_Small_A.entity.ot"
material_base = "Scenery\\DarkHills\\M_Walls_Ruins.mat.ot"

# Authored at game scale (door 2.37 tall), ground at y=0, 54k vertices.
# ⚠ Keep scale 1.0 and no rotate_deg: the collision boxes are in the prop's
# own space and do not follow the mesh transform.
transform = { fit = "rig", scale = 1.0 }

# Deck (top y = 0.5), the ramp down the door side, and the hut body.
collision = [
  { kind = "ground", size = [4.9, 1.0, 4.15], at = [0.0, 0.0, -0.775] },
  { kind = "ground", size = [1.6, 0.5, 1.629], at = [0.0, 0.012, 1.998], rot = [17.88, 0.0, 0.0] },
  { kind = "wall",   size = [4.0, 2.5, 3.0],  at = [0.0, 1.75, -0.9] },
]

# ⚠ Every table header goes below this line.

[slots]
albedo = "Scenery\\DarkHills\\T_Walls_Ruins_ALB.tga"
mra    = "Scenery\\DarkHills\\T_Walls_Ruins_MRA.tga"
normal = "Scenery\\DarkHills\\T_Walls_Ruins_NRM.tga"

[marker]
icon = "icon.png"
reveal_radius = 20000.0

[mod]
id          = "fishermans-camp"
name        = "Fisherman's Camp"
version     = "0.7.0"
author      = "RSMM"
description = "Adds a fisherman's hut to the Dark Hills. Step up to its door and you are taken to the fishing platform, a whole fan-art scene in a room of its own (the way the Ghoul den and the Thieves' stashes work): the tall-roofed hut on the upper deck, the giant catch on its grate, the crane and drying rack, walkways round an open water hole, crates, barrels and tarps."
enabled     = true
load_order  = 32
sdk_version = ">=3.0,<4"
tags = ["world", "map", "poi", "structures", "custom-art"]
# Map generation is seeded run state: everyone in the lobby needs this mod.
multiplayer_scope = "deterministic-shared"

# The hut (pois/fishermans_hut) takes one Dark Hills crystal clearing; its door
# teleports you to the platform room (pois/platform_room), which the map
# generator puts in one of its off-map room slots because the hut `needs` it.
#
# ⚠ The art (art/, pois/*/*.glb|png, assets/) is fan art and stays off GitHub;
# see the mods repo .gitignore. Rebuild it locally from the fan-art zip.

# At most ONE hut per map: Dark Hills has 5 off-map room slots and its own
# rooms (Ghoul den, a Thieves' stash, up to two stone reserves) use up to 4,
# so a second hut would need a room with nowhere to go.
[[content]]
kind       = "tilegen"
id         = "one_hut"
chapter    = "DarkHills"
add_quotas = { "Fishermans_Entrance" = 1 }

[[experiment]]
id       = "hut_found"
question = "did a Dark Hills crystal clearing hold the fisherman's hut (with its minimap icon) instead of a crystal? Only one per map."

[[experiment]]
id       = "hut_draws"
question = "is the hut textured and standing on the ground (not grey, not invisible)?"

[[experiment]]
id       = "door_teleports"
question = "does a prompt appear at the hut's door, and does using it take you somewhere (fade out / in)? Where do you land?"

[[experiment]]
id       = "room_draws"
question = "in the room: do you see the fishing platform (decks, the big hut, the fish on the grate, ramps, posts round the water hole) and a dark water floor? Is it lit, or pitch black?"

[[experiment]]
id       = "room_walk"
question = "can you walk the platform: up the long ramps from the water floor, up the tarp ramp or the stair to the upper deck? Any invisible wall across a walkway?"

[[experiment]]
id       = "room_return"
question = "does the teleporter on the front walkway (by the glow) take you back out to the hut?"

[[experiment]]
id       = "no_crash"
question = "did the run load and survive, including entering and leaving the room? Did the Ghoul den and Thieves' stash still work?"

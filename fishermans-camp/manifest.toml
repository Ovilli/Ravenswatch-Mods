[mod]
id          = "fishermans-camp"
name        = "Fisherman's Camp"
version     = "0.9.1"
author      = "RSMM"
description = "Adds a fisherman's hut to the Dark Hills. Step up to its door and you are taken to the fishing platform, a whole fan-art scene in a room of its own (the way the Ghoul den and the Thieves' stashes work): the tall-roofed hut on the upper deck, the giant catch on its grate, the crane and drying rack, walkways round an open water hole, crates, barrels and tarps."
enabled     = true
load_order  = 32
sdk_version = ">=3.0,<4"
# The fish quest uses the `ingredient` kind, which is not proven in game yet.
experimental = true
tags = ["world", "map", "poi", "structures", "custom-art"]
# Map generation is seeded run state: everyone in the lobby needs this mod.
multiplayer_scope = "deterministic-shared"

# The hut (pois/fishermans_hut) takes one 6x6 Dark Hills crystal clearing; its door
# teleports you to the platform room (pois/platform_room), which the map
# generator puts in one of its off-map room slots because the hut `needs` it.
#
# ⚠ The art (art/, pois/*/*.glb|png, assets/) is fan art and stays off GitHub;
# see the mods repo .gitignore. Rebuild it locally from the fan-art zip.

# At most ONE hut per map: Dark Hills has 5 off-map room slots and its own
# rooms (Ghoul den, a Thieves' stash, up to two stone reserves) use up to 4,
# so a second hut would need a room with nowhere to go.
# THE FISH QUEST — the 3 Pigs straw quest in reverse. Fish piles lie out on the
# map (pois/fish_crates, pulled in round the hut like the straw house's crates);
# carry them down to the giant catch in the platform room. Hand in 8 fish for a
# reward (the pig house's pick-a-magic-object chest), then 12 more for a
# second, then 20 for a third: the wishing well's rising price, in fish.
[[content]]
kind     = "ingredient"
id       = "fish"
name     = "Fish"
icon     = "icons/fish_ingredient.png"
pickups  = [
  { id = "fish",      count = 1, look = "DarkHills\\SceneryObjects_DarkHills\\Fish_Dead.entity.ot" },
  { id = "fish_pile", count = 4, look = "DarkHills\\SceneryObjects_DarkHills\\Fishes_Ground_A.entity.ot" },
]
delivery = { id = "catch", prices = [8, 12, 20] }

[[content]]
kind       = "tilegen"
id         = "one_hut"
chapter    = "DarkHills"
add_quotas = { "Fishermans_Entrance" = 1 }

[[experiment]]
id       = "hut_found"
question = "v0.8 moved the hut from the 40x40 Old Shipyard to a 6x6 crystal clearing: did a hut appear (minimap icon), and only one per map? If it never shows in several runs, the 6x6 entrance does not work and it goes back to 40x40."

[[experiment]]
id       = "door_teleports"
question = "does the hut door still take you to the platform, and do you arrive in shallow water in front of the front walkway, facing the platform?"

[[experiment]]
id       = "room_scale"
question = "v0.8.1 is 2.5x (was 3x): do the heroes now look the right size on the platform?"

[[experiment]]
id       = "room_atmosphere"
question = "does the underground look (dim light, fog, colour) stay on the whole time, everywhere on the platform and in the water, including up the ramps and on the upper deck?"

[[experiment]]
id       = "room_look"
question = "v0.8.2: is the water now brown and murky with reeds round the platform's edge, like the reference art? No black floor? Still no rocky bumps?"

[[experiment]]
id       = "fish_ingredient"
question = "v0.9: in Lua, does R.ingredient.add(\"Fish\", 3) show 3 fish (with the fish icon) on the HUD? That proves the new Fish ingredient loaded."

[[experiment]]
id       = "fish_crates"
question = "are there straw-quest-style crate spots round the hut (up to 12, within ~130 m) with a pile of fish on each, marked on the minimap? Does picking one up add 4 fish to the HUD?"

[[experiment]]
id       = "fish_handin"
question = "at the giant fish in the room: does a hold prompt with a fish icon and a 0/8 counter appear? Handing in 8 fish: does the pig house's pick-a-magic-object reward appear? Then 12 and 20 for the 2nd and 3rd rewards?"

[[experiment]]
id       = "room_scale2"
question = "the room is 2x now (was 2.5x): is the size right? Can you still walk every ramp, with no invisible posts or drops you can slip through?"

[[experiment]]
id       = "right_ramp"
question = "v0.8.4: can you walk freely up and down the right long ramp now (the invisible post in its mouth is gone)? Any other spot that blocks?"

[[experiment]]
id       = "camp"
question = "is there an enemy camp on the upper deck by the hut? Do the enemies spawn, stay on the platform and fight normally (no falling through decks, no getting stuck)?"

[[experiment]]
id       = "fish_prompt"
question = "walk up to the giant fish: does a hold-to-interact prompt appear at the fish (not somewhere else on the deck)? Is it blocked while enemies are near (in combat)? Interacting does nothing yet."

[[experiment]]
id       = "edges"
question = "v0.8.3: hug walls and railings everywhere, especially where ramps start: do you still drop under the map for a moment? Can you step up or down any deck edge without a ramp, or slip out through a gap in a fence?"

[[experiment]]
id       = "props_physics"
question = "break the crates and barrels: does anything stay floating where one stood? Can you walk right up to the big fish now?"

[[experiment]]
id       = "light_cloth"
question = "is the room bright enough now (brighter ambient + 12 warm lanterns on the decks)? Do the tarps look torn and natural instead of square?"

[[experiment]]
id       = "room_walk"
question = "the ramp steps are half as high now: is walking up the ramps smooth, and does the camera stay steady going up and down them?"

[[experiment]]
id       = "room_props"
question = "the crates and barrels are now the game's own destructible ones: do they break when hit (and drop anything)? Do the big fish, the drying rack and the nets block you now? Anything else you can still walk through?"

[[experiment]]
id       = "room_walls"
question = "does the invisible wall still stop you before the water ends?"

[[experiment]]
id       = "room_exits"
question = "do all 3 return teleporters (arrival, foot of each long ramp) take you back to the hut?"

[[experiment]]
id       = "room_light"
question = "is the room lit well enough?"

[[experiment]]
id       = "no_crash"
question = "did the run load and survive, including entering and leaving the room? Did the Ghoul den and Thieves' stash still work?"

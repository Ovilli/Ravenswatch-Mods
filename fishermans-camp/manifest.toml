[mod]
id          = "fishermans-camp"
name        = "Fisherman's Camp"
version     = "0.4.0"
author      = "RSMM"
description = "Adds a fishing dock to the Dark Hills, built from community fan art: plank bridges on posts across the moat of a ghoul camp, the fisherman's hut raised on its deck, and the giant catch on a gutting floor. Bridges and decks are walkable. A smaller standalone hut also appears in crystal clearings."
enabled     = true
load_order  = 32
sdk_version = ">=3.0,<4"
tags = ["world", "map", "poi", "structures", "custom-art"]
# Map generation is seeded run state: everyone in the lobby needs this mod.
multiplayer_scope = "deterministic-shared"

# The hut takes one of Dark Hills' three Crystal clearings (copies = 1 in
# pois/fishermans_hut/poi.toml), so expect roughly one hut a run and no crystal
# in that clearing.
#
# ⚠ The art (art/, pois/*/*.glb|png, assets/) is fan art and stays off GitHub;
# see the mods repo .gitignore. Rebuild it locally from the fan-art zip.

[[experiment]]
id       = "hut_found"
question = "did a Dark Hills crystal clearing hold the fisherman's hut instead of a crystal?"

[[experiment]]
id       = "art_renders"
question = "does the hut look textured (log walls, plank roof, metal door hinges) rather than grey or a checkerboard, and stand on the ground at about hero scale?"

[[experiment]]
id       = "walk_deck"
question = "can you walk UP the ramp onto the plank deck and stand on it at deck height, and walk back down? (the first mod-written collision: if you walk through the deck at ground level, collision did not take)"

[[experiment]]
id       = "hut_blocks"
question = "does the hut body block you (you cannot walk into the log walls), and do enemies path onto the deck too?"

[[experiment]]
id       = "faces_camera"
question = "does the door face the camera? If not, which way does it face (away / left / right)?"

[[experiment]]
id       = "minimap_marked"
question = "does the hut icon (a brown hut with a blue fish) show on the minimap and the map screen?"

[[experiment]]
id       = "poi_interactable"
question = "does a hold prompt appear on the hut, and does the interaction complete?"

[[experiment]]
id       = "no_crash"
question = "did the run survive, and did the other crystal clearings still spawn their crystals?"

# --- the fishing dock (pois/fishing_dock) ---------------------------------

[[experiment]]
id       = "dock_found"
question = "did a ghoul camp with a moat show the fishing dock (plank bridges with railings, the hut on the island, the giant fish) instead of its usual rocks and reeds? (4 copies: roughly one 40x40 camp in five)"

[[experiment]]
id       = "dock_bridges_walk"
question = "can you cross all three bridges over the moat, and do the railings stop you stepping off the sides?"

[[experiment]]
id       = "dock_cleared"
question = "is the old camp scenery gone (no rocks, reeds or old bridges poking through), while the ghouls still spawn and the camp reward still appears when they die?"

[[experiment]]
id       = "dock_gutting_deck"
question = "can you walk up the ramp onto the raised gutting deck (the giant fish on the green tarp), and do its two railings hold you?"

[[experiment]]
id       = "dock_all_meshes"
question = "do ALL parts of the dock draw: hut, bridges, gutting deck, drying racks with fish? (the dock is six meshes on one prop; a missing part means an extra mesh component did not draw)"

[[experiment]]
id       = "dock_no_crash"
question = "did the run load and survive the dock tile?"

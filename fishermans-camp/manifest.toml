[mod]
id          = "fishermans-camp"
name        = "Fisherman's Camp"
version     = "0.8.1"
author      = "RSMM"
description = "Adds a fisherman's hut to the Dark Hills. Step up to its door and you are taken to the fishing platform, a whole fan-art scene in a room of its own (the way the Ghoul den and the Thieves' stashes work): the tall-roofed hut on the upper deck, the giant catch on its grate, the crane and drying rack, walkways round an open water hole, crates, barrels and tarps."
enabled     = true
load_order  = 32
sdk_version = ">=3.0,<4"
tags = ["world", "map", "poi", "structures", "custom-art"]
# Map generation is seeded run state: everyone in the lobby needs this mod.
multiplayer_scope = "deterministic-shared"

# The hut (pois/fishermans_hut) takes one 6x6 Dark Hills crystal clearing; its door
# teleports you to the platform room (pois/platform_room), which the map
# generator puts in one of its off-map room slots because the hut `needs` it.
#
# ⚠ The art (art/, pois/*/*.glb|png, assets/) is fan art and stays off GitHub;
# see the mods repo .gitignore. Rebuild it locally from the fan-art zip.

# At most ONE hut per map: Dark Hills has 5 off-map room slots and its own
# rooms (Ghoul den, a Thieves' stash, up to two stone reserves) use up to 4,
# so a second hut would need a room with nowhere to go.
[[content]]
kind       = "tilegen"
id         = "one_hut"
chapter    = "DarkHills"
add_quotas = { "Fishermans_Entrance" = 1 }

[[experiment]]
id       = "hut_found"
question = "v0.8 moved the hut from the 40x40 Old Shipyard to a 6x6 crystal clearing: did a hut appear (minimap icon), and only one per map? If it never shows in several runs, the 6x6 entrance does not work and it goes back to 40x40."

[[experiment]]
id       = "door_teleports"
question = "does the hut door still take you to the platform, and do you arrive in shallow water in front of the front walkway, facing the platform?"

[[experiment]]
id       = "room_scale"
question = "v0.8.1 is 2.5x (was 3x): do the heroes now look the right size on the platform?"

[[experiment]]
id       = "room_atmosphere"
question = "does the underground look (dim light, fog, colour) stay on the whole time, everywhere on the platform and in the water, including up the ramps and on the upper deck?"

[[experiment]]
id       = "room_terrain"
question = "still flat shallow water all round, no rocky bumps?"

[[experiment]]
id       = "room_walk"
question = "the ramp steps are half as high now: is walking up the ramps smooth, and does the camera stay steady going up and down them?"

[[experiment]]
id       = "room_props"
question = "the crates and barrels are now the game's own destructible ones: do they break when hit (and drop anything)? Do the big fish, the drying rack and the nets block you now? Anything else you can still walk through?"

[[experiment]]
id       = "room_walls"
question = "does the invisible wall still stop you before the water ends?"

[[experiment]]
id       = "room_exits"
question = "do all 3 return teleporters (arrival, foot of each long ramp) take you back to the hut?"

[[experiment]]
id       = "room_light"
question = "is the room lit well enough?"

[[experiment]]
id       = "no_crash"
question = "did the run load and survive, including entering and leaving the room? Did the Ghoul den and Thieves' stash still work?"

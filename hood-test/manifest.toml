# TESTING ONLY. Step 1 of the "clone Scarlet, no transformation" hero
# (community request 2026-10-29): a Scarlet clone whose passive (night)
# transformation is cut. Question this answers: does unlinking
# `Passive Transform Tester.on_true` keep her human through the night?
# If she still turns, the switch lives in Hero_Alt_Form_Common's
# "Switch Form Tester" and the next attempt targets that.

[mod]
id           = "hood-test"
name         = "Hood test"
version      = "0.1.0"
author       = "RSMM"
description  = "Scarlet clone that never turns into the wolf (test)."
enabled      = true
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes", "test"]
multiplayer_scope = "deterministic-shared"
experimental = true
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind        = "hero"
id          = "Hood"
base        = "Red"
name        = "Hood"
description = "Scarlet without the wolf."

[[content.abilities]]
link = "Passive Transform Tester.on_true"
to   = ""

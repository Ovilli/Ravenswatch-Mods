# TEST — the book's Objects tab with many added items. Before the
# compendium fix every tier past its vanilla count drew over the next frame.
# `rsmm apply` should print "[compendium] widening item grids ...".
#
#   Common    10 -> 25 items, 20 columns
#   Rare      10 -> 20 items, 20 columns
#   Epic      10 -> 15 items, 15 columns
#   Legendary 14 -> 26 items, 13 columns
#   Cursed    14 -> 14 items, 10 columns
#   (Cursed gets nothing: the control row, it must look exactly like vanilla.)
#
# WHAT TO CHECK IN GAME: Book -> Objects. Every row stays inside its own frame,
# the icons shrink to fit, and nothing overlaps the next tier. The items show
# up in the book on sight; you do not need to find them in a run.
[mod]
multiplayer_scope = "deterministic-shared"
id          = "compendium-overflow-test"
name        = "Compendium Overflow Test"
version     = "0.1.0"
author      = "test"
description = "TEST: 42 copied items across four tiers, to check the book's Objects tab fits them."
enabled     = false
sdk_version = ">=3.0,<4"
tags        = []
license     = ""

[[content]]
kind        = "item"
id          = "Armor_Per_Obj_01"
base        = "Common/Armor_Per_Object"
name        = "Overflow Common 01"
description = "Test copy of Armor_Per_Object, to fill the book's Common row."


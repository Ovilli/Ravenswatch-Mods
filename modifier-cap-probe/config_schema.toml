# STAGE 2 is off by default: it writes to a live engine vector, where stage 1
# only reads. 5 is vanilla behaviour (the engine pads to five on its own).
[[field]]
key     = "slots"
type    = "int"
label   = "Modifier slots to offer"
help    = "5 is the game's own behaviour. 6 or more adds empty slots to the custom-run page, to test whether a sixth modifier can be selected at all. Experiment, not a feature — a raised cap is seeded run state, so every player in a lobby would need the same value."
default = 5
min     = 5
max     = 8

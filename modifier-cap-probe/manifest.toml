[mod]
id          = "modifier-cap-probe"
name        = "Modifier Cap Probe"
version     = "0.1.0"
author      = "RSMM"
description = "Diagnostic. Watches how many selected game modifiers reach the challenge page's display path, to find where the five-negative-modes limit is actually enforced. Read-only: it logs and changes nothing."
enabled     = false
load_order  = 90
sdk_version = ">=3.0,<4"
license     = "MIT"

# Ships no content and no assets — one Lua file reading one engine number.
# Nothing is written to the game, so this cannot be the cause of a crash in a
# run it is installed for.
tags = ["diagnostic", "modifiers"]

# Read-only observation of a UI refresh path. It never touches run state, so it
# does not need every peer to agree.
multiplayer_scope = "local-only"

# WHAT THIS ANSWERS, and why it needs to run rather than be read.
#
# Three candidate homes for the "5 negative modes" cap were checked statically
# and all three were wrong: the challenge page has no slot widgets (the list is
# spawner-driven), the >=4/5/6 ladder gates UI widget groups by profile value,
# and the pad-to-five loop only ever APPENDS, so five is a floor rather than a
# ceiling. Sweeping all 168 functions in both controller clusters turned up no
# `count >= 5` bound at all.
#
# So the question left is what count the display path actually receives, which
# only the running game can say. Add modifiers on the custom-run page, try for a
# sixth, then `rsmm log --grep modifier-cap`.
#
# ⚠ Raising the cap is NOT just a constant even if this comes back favourable:
# the selected set is seeded run state, so every peer in a lobby has to agree or
# the run desyncs.

[[experiment]]
id       = "cap_ceiling"
question = "adding modifiers one at a time on the custom-run page, what is the highest count the log reports — does it stop at 5, or does a 6 ever appear?"

[[experiment]]
id       = "sixth_refused"
question = "when you try to add a sixth modifier, what does the game do — is the slot simply not there, does the click do nothing, or do you hear the failure sound?"

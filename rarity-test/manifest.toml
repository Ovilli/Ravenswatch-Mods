# TEST — changing a copied item's rarity. The tier the game shows is the
# entity's Quality value; `rarity` now sets it (and the folder).
#
#   Rarity_Test_Comm  base Common/Armor_Per_Object  rarity = "Legendary"  (Common -> Legendary)
#   Rarity_Test_Rar   base Increase_Shield (Rare)   rarity = "Common"     (Rare -> Common)
#
# WHAT TO CHECK IN GAME: "Rarity Test Legendary" shows the Legendary frame and
# colour, "Rarity Test Common" the Common ones (the Sandman shop or a chest).
[mod]
multiplayer_scope = "deterministic-shared"
id          = "rarity-test"
name        = "Rarity Test"
version     = "0.1.0"
author      = "test"
description = "TEST: two copied items moved to another rarity, to check the tier changes in game."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = []
license     = ""

[[content]]
kind        = "item"
id          = "Rarity_Test_Comm"
base        = "Common/Armor_Per_Object"
name        = "Rarity Test Legendary"
description = "Test item. Common base, set to Legendary."
rarity      = "Legendary"

[[content]]
kind        = "item"
id          = "Rarity_Test_Rar"
base        = "Increase_Shield"
name        = "Rarity Test Common"
description = "Test item. Rare base, set to Common."
rarity      = "Common"

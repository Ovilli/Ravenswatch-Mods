# Ids are FMOD paths ("bus:/Music", "event:/Heroes/Red/Human/Skills/..."),
# listed from the installed game's strings bank by the fmod-sounds source.
# `muted` is the coarse list (categories, mixer buses, folders); each hero
# field lists that hero's sounds one by one ("fmod-sounds:<folder>").

[fields.muted]
type    = "multiselect"
source  = "fmod-sounds"
label   = "Music, menus, enemies & more"
default = []

[fields.hero_scarlet]
type    = "multiselect"
source  = "fmod-sounds:event:/Heroes/Red"
label   = "Scarlet sounds"
default = []


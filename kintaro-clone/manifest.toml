[mod]
id           = "kintaro-clone"
name         = "Kintaro Clone (Brakk)"
version      = "0.1.0"
author       = "Ovilli"
description  = "A 13th hero cloned from Kintaro, named Brakk. Starts as an exact copy of Kintaro; edit the [content] block to change him."
enabled      = true
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes", "dev"]
multiplayer_scope = "deterministic-shared"
experimental = true

# A new hero cloned from Kintaro. With only `base` it plays exactly as Kintaro.
# Every other field makes him his own (see src/rsmm/sdk/kinds/heros.py for the
# full list). Change them here later, then `rsmm restore --all && rsmm apply`.
[[content]]
kind        = "hero"
id          = "Brakk"
base        = "Kintaro"
name        = "Brakk"
description = "A Kintaro clone built with RSMM. A starting point to reshape."

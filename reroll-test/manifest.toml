# TEST — R.reroll.add (EXPERIMENTAL SDK API, static RE 2026-10-10).
#
# init.lua grants 3 offer rerolls once per run, as soon as the hero has acted
# (the grant goes through the hero's event dispatcher, which the SDK learns from
# the hero's first ability/attack).
#
# WHAT TO CHECK IN GAME (any hero, solo first)
#   1. Start a run and attack once. The reroll counter on the next offer screen
#      (item/talent choice) shows 3 more rerolls than usual, and they work.

#        [rsmm.reroll] dispatched GAIN_REROLL +3 ... rerolls X -> X+3
#      X -> X+3 proves R.reroll.get reads the same counter the game uses.
#   3. Next run: it grants 3 again (one grant per run, not per session).
#   Later, co-op: the grant should reach only YOUR hero.

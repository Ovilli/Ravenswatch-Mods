name: Publish mod ZIPs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out RSMM packer
        uses: actions/checkout@v5
        with:
          repository: Ovilli/RavenswatchModManager
          ref: main
          path: rsmm-manager

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install RSMM
        run: python -m pip install -e ./rsmm-manager

      # Lint before pack: a mod that fails `rsmm lint` used to be packed and
      # published anyway. It is now left out (and its old ZIP removed below),
      # the rest still publish, and the job fails at the end so it shows.
      # Folders tagged `debug` or `test` are probes, not releases: neither
      # linted nor packed (RSMM #202, decision 6).
      - name: Lint and package mods
        shell: bash
        env:
          RSMM_REPO_ROOT: ${{ github.workspace }}/rsmm-manager
          RSMM_MODS_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > lint-failed.txt

          while IFS= read -r -d '' manifest; do
            mod_dir="${manifest%/manifest.toml}"
            mod_name="${mod_dir#./}"
            # `_merged` (and any `_*`) is apply's generated output, not a mod.
            [[ "$mod_name" == _* ]] && continue
            if python - "$manifest" <<'PY'
          import sys, tomllib
          tags = tomllib.load(open(sys.argv[1], "rb")).get("mod", {}).get("tags") or []
          sys.exit(0 if {str(t).strip().lower() for t in tags} & {"debug", "test"} else 1)
          PY
            then
              echo "skip $mod_name (tagged debug/test)"
              continue
            fi
            if ! rsmm lint "$mod_name"; then
              echo "::error title=rsmm lint::$mod_name fails rsmm lint; not published"
              echo "$mod_name" >> lint-failed.txt
              continue
            fi
            rsmm pack "$mod_name"
            cp "rsmm-manager/dist/${mod_name}.zip" "dist/${mod_name}.zip"
          done < <(find . -mindepth 2 -maxdepth 2 -type f -name manifest.toml -print0 | sort -z)

          test -n "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"

      - name: Publish latest ZIPs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mod-downloads
          name: Mod downloads (latest)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.zip
          overwrite_files: true
          fail_on_unmatched_files: true

      # action-gh-release only uploads/overwrites, so a deleted mod's ZIP would
      # stay on the release forever. Drop every ZIP this run didn't build.
      - name: Remove ZIPs of deleted mods
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view mod-downloads --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r asset; do
              if [[ "$asset" == *.zip && ! -f "dist/$asset" ]]; then
                echo "Removing stale $asset"
                gh release delete-asset mod-downloads "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done

      - name: Fail if a mod failed lint
        shell: bash
        run: |
          if [[ -s lint-failed.txt ]]; then
            echo "Not published (fix rsmm lint, then push):"
            sed 's/^/  /' lint-failed.txt
            exit 1
          fi

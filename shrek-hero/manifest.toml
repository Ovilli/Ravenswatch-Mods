# WHAT TO RECORD. The `mesh` kind is rated experimental for exactly one reason:
# a custom mesh has never been SEEN rendering in-game. This mod is the cheapest
# way to answer that, because the swap is on the hero you are looking at for
# the whole run.
#
#   rsmm exp answer shrek-hero mesh_renders pass -m "Wukong is an ogre"
#
[[experiment]]
id       = "mesh_renders"
question = "does the custom mesh render in place of the hero?"

[[experiment]]
id       = "rig_survives"
question = "does it animate with the skeleton, or is the pose broken?"

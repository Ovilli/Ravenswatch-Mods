# Dire Wolf. The special's howl calls a pet (`frame.pets` below) on the pet
# base, so it follows Blood Wolf and goes for the enemies. Pam (2026-11-14):
# the base special is the CLAW dire wolf; her Rabid talent turns it into the
# bite wolf that bursts.
[content.frame.abilities.special]
icon        = "Heroes\\Red\\Ability_Wolf_Special.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Special_Disabled.png"
name        = "Dire Wolf"
description = "• Howl, and a dire wolf answers: it follows you and claws your enemies"

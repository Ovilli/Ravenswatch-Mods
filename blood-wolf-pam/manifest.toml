    { add_cinebloc = "Ultimate Ability Anim", to = "Hyper Dash Agressive Defense Active FMod Event", value = 0.15 },
    { add_cinebloc = "Ultimate Ability Anim", to = "Hyper Dash Dash Fx", value = 0.01 },
    { clone = ["Fx Wolf Primary Ability Impact"], rename = { "Fx Wolf Primary Ability Impact" = "Hyper Dash Character Impact Fx" } },
    { replace_subobject = "Hyper Dash Character Impact Fx.bytes_1[0]", donor = "Fx Wolf Primary Ability Impact.bytes_1[0]", replace_ref = { "Wolf Primary Ability Damage" = "Ultimate Ability Hit 1 Damage" } },
    { link = "Ultimate Ability Hit 1 Damage.ref_32", to = "Hyper Dash Character Impact Fx" },
    { clone = ["Skill Trait Active Heal Resource Gain"], from = "Red", rename = { "Skill Trait Active Heal Resource Gain" = "Hyper Dash Kill Heal Resource Gain" } },
    { link = "Hyper Dash Kill Heal Resource Gain.value_2", to = "" },

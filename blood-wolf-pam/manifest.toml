duration    = 0.6
cooldown    = 8
moving      = true        # howled on the move, as the clone's special was


# One wolf per press of the special, a pet that follows Blood Wolf and charges
# the enemies, gone after 20 s.
#   Base: the dire wolf as it fights by default, with its claw (Double Slash).
#   With Rabid (`upgrade`, while "Skill Special Rabid" is held): the bomber
#   wolf as Pam tuned it in the clone (0.1): blood-red, it bites instead, and
#   its first bite blows it up into Blood Wolf's bleed bomb (also if killed or
#   after 20 s). The bite: every enemy in a cone twice as wide and long, from
#   closer, 35% faster, retried 0.5 s after a miss, none of the enemy wolf's

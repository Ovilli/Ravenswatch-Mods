    { event = "Event Hyper Dash Kill" },
    { add_link = "Event Hyper Dash Kill.activates", to = "Hyper Dash Kill Heal Resource Gain" },
    { link = "Ultimate Ability Hit 1 Damage.ref_33", to = "Event Hyper Dash Kill" },
    # Bloody Howl (ultimate2): enemy Alpha Wolf howl audio, circle decal, 9m traverser/FX scaling, and dash-cancel.
    { clone = ["Attack Howl Active FMod Event", "Attack Howl Active Tic FMod Event", "Attack Howl Character Impact FMod Event", "Attack Howl Attack Radius", "Attack Howl Warning Scale Operation", "Attack Howl Active Fx Scale Operation", "Attack Howl Active Mesh"], from = "Enemies/Wolves/Wolves_Model", rename = { "Attack Howl Active FMod Event" = "Bloody Howl Active FMod Event", "Attack Howl Active Tic FMod Event" = "Bloody Howl Tic FMod Event", "Attack Howl Character Impact FMod Event" = "Bloody Howl Impact FMod Event", "Attack Howl Attack Radius" = "Bloody Howl Attack Radius", "Attack Howl Warning Scale Operation" = "Bloody Howl Warning Scale Operation", "Attack Howl Active Fx Scale Operation" = "Bloody Howl Fx Scale Operation", "Attack Howl Active Mesh" = "Bloody Howl Active Mesh" } },
    { add_link = "State Ultimate2 Ability.while_active", to = "Bloody Howl Active FMod Event" },
    { add_link = "State Ultimate2 Ability.while_active", to = "Bloody Howl Active Mesh" },
    # Allow Dash (and other actions) to interrupt Bloody Howl and cancel remaining hit/end timers on exit.
    { set = "Ultimate Power 2 Controller.value_8", value = true },
    { remove_link = "State Ultimate2 Ability.activates", to = "Ultimate2 Ability Hit 1 Timer" },

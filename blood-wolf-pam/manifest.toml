# Blood Wolf, written from scratch (no base hero).
#
# Until 0.1.0 Blood Wolf was a clone of Scarlet locked into her wolf form: a
# copy of her whole family with ~90 graph edits on top. From 0.2.0 nothing of
# Scarlet's is copied. Its entities (engine/hero_frame.py), buttons
# (engine/hero_ability.py) and roster record (engine/herodef_frame.py) are
# written from this file on the shared hero base; Scarlet (the rig) lends
# ASSETS only: the wolf's mesh, skeleton, clips, effects and button pictures.
# The clone manifest is kept at ~/.cache/rsmm/blood-wolf-kit/manifest.clone.toml.
#
# What the clone had that this file cannot say yet (see the notes at each
# button): the blood seed riding on the bitten enemy, and Scarlet's
# defense/ultimate behaviour and talents (Blood Wolf now has buttons and talents of its own).

[mod]
id                = "blood-wolf-pam"
name              = "Blood Wolf"
version           = "0.2.0"
author            = "Local"
description       = "Blood Wolf: a wolf hero of its own, written from scratch on Scarlet's wolf assets."
license           = "MIT"
sdk_version       = ">=3.0,<4"
enabled           = true
multiplayer_scope = "deterministic-shared"
experimental      = true
tags              = ["hero", "red"]

[[content]]
kind        = "hero"
id          = "BloodWolf"
name        = "Blood Wolf"
description = "The wolf that never turned back. It hunts in a pack of its own making, and everything it bites bleeds."

[content.frame]
rig      = "Hero_Red"
mesh     = "Characters\\Heroes\\RED\\RED_wolf_GEO.fbx"
material = "Characters\\Heroes\\RED\\Textures\\M_RED_Wolf.mat.ot"
# The wolf's own HUD portrait (the rig's default is Scarlet, human).
portrait = "Heroes\\Red\\Portrait_RED_WOLF_01.png"

# Pam's seed, step for step from the clone, on the bite's own damage record
# (Scarlet's "Wolf Primary Ability Damage", lent with the power's template, as
# in the clone). Carmilla's seed debuff and its burst listener + spawner.
edits = [
    { clone = ["Skill Power Special Bomb Modifier", "Skill Power Special Bomb Time Before Explosion Value"], from = "Carmilla", rename = { "Skill Power Special Bomb Modifier" = "Wolf Power Blood Seed Modifier", "Skill Power Special Bomb Time Before Explosion Value" = "Wolf Power Blood Seed Time Before Explosion Value" } },
    { set = "Wolf Power Blood Seed Modifier.duration", value = 1.5 },
    { clone = ["Blood Bomb Explode Listener", "Skill Power Special Bomb Spawner"], from = "Carmilla", rename = { "Blood Bomb Explode Listener" = "Wolf Blood Bomb Explode Listener", "Skill Power Special Bomb Spawner" = "Wolf Blood Bomb Spawner" } },
    { remove_link = "Wolf Blood Bomb Spawner.spawner_values[0]" },
    { set = "Wolf Blood Bomb Spawner.template[1]", value = "own:Bomb" },
    { override = "Child Event Initialize", from = "Character_Common/Character_Common" },
    { add_link = "Child Event Initialize.activates", to = "Wolf Blood Bomb Explode Listener" },
    { add_subobject = "Wolf Primary Ability Damage.bytes_36", from = "Carmilla", donor = "Skill Defense Aoe Bleed Damage.bytes_36[0]", replace_ref = { "Skill Defense Aoe Bleed Modifier" = "Wolf Power Blood Seed Modifier" } },
]

# The rig lends the wolf's clip for every slot Scarlet has in two forms. The
# book and the end of a teleport are human-only on her; the wolf's own here.
[content.frame.slots."Preview Default In Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Narrative\\RED_Wolf_Book_InSelection.fbx"

[content.frame.slots."Preview Default Idle Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Narrative\\RED_Wolf_Book_LoopSelection.fbx"

[content.frame.slots."Preview Select Hero In Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Narrative\\RED_Wolf_Book_InSelection.fbx"

[content.frame.slots."Preview Select Hero Idle Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Narrative\\RED_Wolf_Book_LoopSelection.fbx"

[content.frame.slots."Preview Victory Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Narrative\\RED_Wolf_Book_LoopSelection.fbx"

[content.frame.slots."Preview Defeat Animatic"]
clip = "Characters\\Heroes\\RED\\Animations\\Communs\\RED_Wolf_DeathDoor_Loop.fbx"

[content.frame.slots."Teleporting Out End Cine Anim"]
clip = "Characters\\Heroes\\RED\\Animations\\Communs\\RED_Wolf_Flock_Teleportation_Out.fbx"

# --- Its bleed bomb -------------------------------------------------------------
# What a bomber wolf bursts into: Scarlet's bomb as an entity of Blood Wolf's
# own, with the edits Pam's playtests settled on in the clone (0.1.0), step
# for step. Named "own:Bomb" by the summons' `burst`.
[content.frame.entities.Bomb]
from  = "Heroes/Hero_Red/Hero_Red_Bomb"
edits = [
    # Configure Blood Seed Burst Entity (Hero_Red_Bomb -> Hero_BloodWolf_Bomb)
    { remove_link = "Event Initialize.activates", to = "Mesh" },
    # Start on the ground with a near-zero fuse, not in State Exploding: a bomb
    # that starts exploding fires its hit on its first frame, before it stands
    # where it spawned, and hits nothing. On Ground's own Explosion Timer is
    # what moves Scarlet's bomb to State Exploding.
    { link = "Default State Machine.ref_2", to = "State On Ground" },
    { set = "Explosion Timer.duration", value = 0.1 },
    # No warning circle or warm-up glow for a 0.1 s fuse.
    { remove_link = "State On Ground.while_active", to = "Warning_Zone_Mesh" },
    { remove_link = "State On Ground.while_active", to = "Warning_Zone_Growing_Color_Anim" },
    { remove_link = "State On Ground.while_active", to = "Bomb_Explosion_Warmup_Emissive_Anim" },
    # Burst tuning. Scarlet's bomb also fires a second attack at HEROES
    # ("Explosion Attack Heroes", what staggered the wolf): not started here.
    { remove_link = "State Exploding.activates", to = "Explosion Attack Heroes Tester" },
    # Hit damage: the record multiplies by "Explosion Damage Multiplier" (4);
    # 1 is the same 10 at level 1 as the 3rd combo hit.
    { set = "Explosion Damage Multiplier.value", value = 1.0 },
    # Stagger: value_31 (wolf basic 8, wolf power 25, Scarlet's bomb 50).
    { set = "Explosion Damage.value_31", value = 30.0 },
    # A bleed only deals damage through a "Remote Damage Owner" on the entity
    # that APPLIED it: every 0.5 s the target finds that component on the
    # modifier's source, writes the tick into it, and the owner's own "Bleed
    # Damage" deals the hit. Characters carry one (Character_Common); Scarlet's
    # bomb does not, so its bleed ticked for 0. Give the bomb the owner and the
    # bleed half of its machinery (Ghidra b9c3, 2026-11-01: FUN_1403d6120 ->
    # FUN_1403fbe30 -> FUN_1403d1cc0).
    # The owner and its bleed-amount read come from Character_Common. Its "Bleed
    # Damage" can NOT: Character_Common's damage records are class version 1.23,
    # the bomb's 1.21, and a 1.23 record in a 1.21 file is read with the wrong
    # layout (the bomb never loaded). So the bomb's own bleed damage is a copy of
    # its own "Explosion Damage Heroes" (1.21, no debuffs, 0 damage, 0 stagger),
    # set to Character_Common's Bleed Damage values.
    { clone = ["Remote Damage Owner", "UGLY Fix Bleed Double AP Damage Operation"], from = "Character_Common/Character_Common", rename = { "Remote Damage Owner" = "Remote Damage Owner", "UGLY Fix Bleed Double AP Damage Operation" = "UGLY Fix Bleed Double AP Damage Operation" } },
    { clone = ["Explosion Damage Heroes"], rename = { "Explosion Damage Heroes" = "Bleed Damage" } },
    { link = "Bleed Damage.value_2", to = "UGLY Fix Bleed Double AP Damage Operation" },
    { link = "Remote Damage Owner.ref_3", to = "Bleed Damage" },
    { set = "Bleed Damage.value_4", value = 0.0 },
    { set = "Bleed Damage.value_9", value = 5.0 },
    { set = "Bleed Damage.value_10", value = 10.0 },
    { set = "Bleed Damage.value_11", value = 10.0 },
    { set = "Bleed Damage.value_16", value = false },
    { set = "Bleed Damage.value_27", value = 0.0 },
    { set = "Bleed Damage.value_28", value = 1.0 },
    { set = "Bleed Damage.value_35", value = -1 },
    # The last field that differed: 1 on every bomb damage record, 0 on the
    # character's DoT damage. Left at 1, the bleed ignored the enemy's damage
    # reduction (armour plates) in game; most likely the "ignore resistance" flag.
    { set = "Bleed Damage.bytes_30", value = 0 },
    # Only the bleed slot (ref_3); the other eight DoTs stay unowned here.
    { link = "Remote Damage Owner.ref_2", to = "" },
    { link = "Remote Damage Owner.ref_4", to = "" },
    { link = "Remote Damage Owner.ref_5", to = "" },
    { link = "Remote Damage Owner.ref_6", to = "" },
    { link = "Remote Damage Owner.ref_7", to = "" },
    { link = "Remote Damage Owner.ref_8", to = "" },
    { link = "Remote Damage Owner.ref_9", to = "" },
    { link = "Remote Damage Owner.ref_10", to = "" },
    # The owner must outlive the bleed (5 s); the bomb was gone 0.5 s after the
    # burst. Its model is already hidden (State Exploding deactivates Mesh).
    { set = "Despawn Timer.duration", value = 6.0 },
    # Sound: Carmilla's burst ("Carm_BloodRage") instead of Scarlet's bomb blast
    # ("Red_Skil_Pyromania"), and no fuse sound for the 0.1 s on the ground.
    { clone = ["Explosion FMod Event Active"], from = "Heroes/Hero_Carmilla/Hero_Carmilla_Power_Orb", rename = { "Explosion FMod Event Active" = "Blood Burst FMod Event" } },
    { remove_link = "State Exploding.activates", to = "Explosion Default FMod Event" },
    { add_link = "State Exploding.activates", to = "Blood Burst FMod Event" },
    { remove_link = "State On Ground.while_active", to = "On Ground FMod Event" },
    # Bleed on the burst: a flat 100 over 5 s, through a copy of Carmilla's debuff.
    { clone = ["Skill Primary Bleed Modifier"], from = "Red", rename = { "Skill Primary Bleed Modifier" = "Wolf Blood Seed Explosion Bleed Modifier" } },
    { set = "Wolf Blood Seed Explosion Bleed Modifier.amount", value = 100.0 },
    { add_subobject = "Explosion Damage.bytes_36", from = "Carmilla", donor = "Skill Defense Aoe Bleed Damage.bytes_36[0]", replace_ref = { "Skill Defense Aoe Bleed Modifier" = "Wolf Blood Seed Explosion Bleed Modifier" } },
    # Burst VFX: the injection's own, not Scarlet's bomb. This entity is Scarlet's
    # bomb, so its explosion played RED_Bomb_Explosion_5m + the ground impact;
    # Carmilla's burst is three setups on her Power Orb's "Explosion Fx Active":
    # the orb's explosion, its core flash, and a ground decal, plus the same
    # camera shake the bomb already had. Slots 0 and 2 are REPLACED in place (the
    # slot id stays, so the Fx the Explosion Fx Selector activates is still the
    # one that plays), and the core flash is appended after them. Each setup
    # carries the parameter slots its vfx declares; they are re-pointed at this
    # entity: the orb's Mesh (the FX's anchor) at this bomb's Mesh, and its two
    # radius reads at this bomb's Explosion Radius.
    { replace_subobject = "Fx_Explosion.bytes_1[0]", from = "Heroes/Hero_Carmilla/Hero_Carmilla_Power_Orb", donor = "Explosion Fx Active.bytes_1[0]", replace_ref = { "Mesh" = "Mesh", "Owner Explosion Radius Get Value" = "Explosion Radius", "Owner Current Radius Get Value" = "Explosion Radius" } },
    { replace_subobject = "Fx_Explosion.bytes_1[2]", from = "Heroes/Hero_Carmilla/Hero_Carmilla_Power_Orb", donor = "Explosion Fx Active.bytes_1[2]", replace_ref = { "Owner Explosion Radius Get Value" = "Explosion Radius" } },
    { add_subobject = "Fx_Explosion.bytes_1", from = "Heroes/Hero_Carmilla/Hero_Carmilla_Power_Orb", donor = "Explosion Fx Active.bytes_1[1]", replace_ref = { "Mesh" = "Mesh" } },
    # No ignite from the bomb (Pam): Scarlet's bomb carries her Ignite talent's
    # debuff (entry 1 of its explosion's debuffs); a 0 s ignite still burned.
    # It becomes a copy of entry 0 (her Reduce Armour talent's, which applies
    # only with that talent), so the list keeps its shape and no ignite is left.
    { replace_subobject = "Explosion Damage.bytes_36[1]", donor = "Explosion Damage.bytes_36[0]" },
    # No Vulnerable from the burst (Pam: the wolf's bite "applied" it). Both
    # entries are Scarlet's Reduce Armour talent debuff (Vulnerable 0.5, 3 s),
    # switched on by a read of that talent on whatever SPAWNED the bomb. From
    # Blood Wolf that is false without the talent; from the bomber wolf (its
    # burst spawner) the read lands on the wolf, which has no such talent, and
    # came out true, so every bite burst applied it. Both are off now, so the
    # talent no longer adds Vulnerable to Blood Seed's burst either.
    { switch_off = "Explosion Damage.bytes_36[0]" },
    { switch_off = "Explosion Damage.bytes_36[1]" },
]

# --- Buttons ---------------------------------------------------------------------
# (The game spells four of the wolf's button pictures "Ability_Wolf_" and their
# greyed twins "Ability_WOLF_": both are named as shipped.)
# Blood Fangs. The clone's three-hit combo, as three steps of its own: claw,
# claw, then the double strike, which is the hit that bleeds.
# Each step plays its whole clip, at Scarlet's own wolf timings (hit, chain
# window, exit): a step cut short ends before the next press is taken, and the
# combo restarted at step 1 every time (playtest 2026-11-13).
[content.frame.abilities.attack]
icon        = "Heroes\\Red\\Ability_Wolf_Attack.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Attack_Disabled.png"
name        = "Blood Fangs"
description = "• A three-hit combo. The third hit makes enemies #Bleed@"
cooldown    = 0.3
combo       = [
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_BasicAttack_Claws_1.fbx", hit_at = 0.37, link_at = 0.42, exit_at = 0.62, hits = [ { radius = 2.8, damage = 150, stagger = 8, fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Basic_Attack_Slash_01_L.vfx.ot" } ] },
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_BasicAttack_Claws_2.fbx", hit_at = 0.37, link_at = 0.42, exit_at = 0.62, hits = [ { radius = 2.8, damage = 150, stagger = 8, fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Basic_Attack_Slash_01_R.vfx.ot" } ] },
    { clip = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Skill_DoubleStrike.fbx", hit_at = 0.23, link_at = 0.6, exit_at = 0.8, hits = [ { radius = 3.2, damage = 180, stagger = 12, status = "Bleed", fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Dash_Attack_Slash_01.vfx.ot", shake = "light" } ] },
]

# Blood Seed, as Pam made it in the clone (0.1): Scarlet's own wolf bite, lent
# whole (template): it rushes at the aimed enemy, bites at once if one is
# already in reach, plays the bite and its recovery, and is intangible
# throughout, with Scarlet's bite effects. Her talents on it are cut. The
# bite plants a blood seed IN the bitten enemy: Carmilla's blood-seed debuff
# on the bite's damage (frame.edits above). The seed bursts into Blood Wolf's
# bleed bomb when it runs out (1.5 s), or at once if the enemy dies first.
[content.frame.abilities.power]
icon        = "Heroes\\Red\\Ability_Wolf_Power.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Power_Disabled.png"
name        = "Blood Seed"
description = "• Rush in and bite, planting a blood seed in what you bite. It bursts into a bleeding explosion shortly after, or as soon as the enemy dies"
template    = "Red: Wolf Primary"
cooldown    = 6
# Pam's clone: the bite's base hit at 1x (Scarlet's is higher).
values      = { "Wolf Primary Ability Damage Multiplier Default" = 1.0 }

# Bomber Wolf. The special's howl calls a pet (`frame.pets` below): Pam's
# blood-red dire wolf on the pet base, so it follows Blood Wolf and goes for
# the enemies.
[content.frame.abilities.special]
icon        = "Heroes\\Red\\Ability_Wolf_Special.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Special_Disabled.png"
name        = "Bomber Wolf"
description = "• Howl, and a dire wolf answers: it follows you and charges your enemies. Its first bite blows it up in a bleeding explosion"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Defensive_Howl.fbx"
duration    = 0.6
cooldown    = 8
moving      = true        # howled on the move, as the clone's special was


# The bomber wolf, as Pam tuned it in the clone (0.1): one per press of the
# special, a pet that follows Blood Wolf and charges the enemies; its first
# bite blows it up into Blood Wolf's bleed bomb, it also bursts if killed or
# after 20 s. The bite: every enemy in a cone twice as wide and long, from
# closer, 35% faster, retried 0.5 s after a miss, none of the enemy wolf's
# own debuffs.
[content.frame.pets]
entity         = "Enemies/Wolves/Standard_Wolf_Dire"
look           = { albedo = "art/Dire_Blood_ALB.png" }
count          = 1
button         = "special"
spawn          = "button"
counter        = "none"
aggro          = true
burst          = "own:Bomb"
burst_on_hit   = true
lifetime       = 20
attack         = "Bite"
attack_area    = 1.2
attack_reach   = 2.0
attack_range   = 1.0
attack_targets = 0
attack_speed   = 1.35
attack_debuffs = false
attack_cooldown = 0.5
appear         = "Characters\\Enemies\\Wolves\\Animations\\Wolf_DireTimber_UTurn_R.fbx"

# Defense and the ultimates: wolf moves of its own (the clone kept Scarlet's).
[content.frame.abilities.defense]
icon        = "Heroes\\Red\\Ability_WOLF_Defensive.png"
name        = "Blood Howl"
description = "• A howl that #stuns@ enemies around you and leaves them #Vulnerable@"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Aggressive_Defense_Howl.fbx"
duration    = 1.0
cooldown    = 10
hits        = [ { at = 0.35, radius = 4.5, damage = 100, stun = 1.0, status = "Vulnerable", fx = "Settings\\Enemies\\Wolves\\Elite_Wolf_Howl_01.vfx.ot", shake = "medium" } ]

[content.frame.abilities.trait]
icon        = "Heroes\\Red\\Ability_WOLF_Trait.png"
name        = "Blood Scent"
description = "• Dart forward and slash: enemies around you #Bleed@ and are left #Weak@"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Dash_Fan_Spikes.fbx"
duration    = 0.7
cooldown    = 12
hits        = [ { at = 0.25, radius = 3, damage = 200, status = "Bleed", fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Bite_01.vfx.ot", shake = "light" }, { at = 0.3, radius = 3, damage = 50, status = "Weak" } ]

[content.frame.abilities.ultimate]
icon        = "Heroes\\Red\\Ability_Wolf_Ultimate_1.png"
icon_disabled = "Heroes\\Red\\Ability_WOLF_Ultimate_1_Disabled.png"
name        = "Blood Frenzy"
description = "• A flurry of claws around you, each hit making enemies #Bleed@, ended by a blow that throws them back"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Attack_Flurry.fbx"
duration    = 2.2
cooldown    = 60
hits        = [
    { at = 0.3, radius = 4.5, damage = 500, status = "Bleed", fx = "Settings\\Heroes\\Hero_Red_FX\\Cleave_Slash_Wolf_Claw.vfx.ot", shake = "light" },
    { at = 0.7, radius = 4.5, damage = 500, fx = "Settings\\Heroes\\Hero_Red_FX\\Cleave_Slash_Wolf_Claw.vfx.ot", shake = "light" },
    { at = 1.1, radius = 4.5, damage = 500, fx = "Settings\\Heroes\\Hero_Red_FX\\Cleave_Slash_Wolf_Claw.vfx.ot", shake = "light" },
    { at = 1.5, radius = 4.5, damage = 500, fx = "Settings\\Heroes\\Hero_Red_FX\\Cleave_Slash_Wolf_Claw.vfx.ot", shake = "light" },
    { at = 1.9, radius = 6, damage = 1500, knockback = 60, stun = 1.0, fx = "Settings\\Heroes\\Hero_Red_FX\\WOLF_Leap_Impact.vfx.ot", shake = "heavy" },
]

[content.frame.abilities.ultimate2]
icon        = "Heroes\\Red\\Ability_WOLF_Ultimate_2.png"
name        = "Pack Howl"
description = "• A howl that #stuns@ everything close and flings three bleed bombs around you"
clip        = "Characters\\Heroes\\RED\\Animations\\Skills\\RED_Wolf_Defensive_Howl.fbx"

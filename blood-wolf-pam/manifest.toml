# --- Its story (7 pages, as every shipped hero) ----------------------------------
[[content.memoirs]]
title = "The Red Hood"
text  = "There was a girl once, and a hood, and a path through the wood she was told never to leave."

[[content.memoirs]]
title = "Grandmother's House"
text  = "What waited in the bed had her grandmother's voice. It did not have her grandmother's teeth."

[[content.memoirs]]
title = "The Bite"
text  = "The huntsman came too late to stop the bite, and just in time to see what it began."

[[content.memoirs]]
title = "Full Moon"
text  = "She learned to wear the wolf like the hood: on at moonrise, off by morning. For a while."

[[content.memoirs]]
title = "The Last Morning"
text  = "One dawn the wolf did not leave. It stood in the doorway, licked its teeth, and found it did not miss her."

[[content.memoirs]]
title = "The Pack"
text  = "A wolf alone is hungry. So it howled into the dark hills, and the dark hills, bleeding, howled back."

[[content.memoirs]]
title = "Blood Wolf"
text  = "The Nightmares call it by no name. They know it by what it leaves behind: everything it has bitten, still bleeding."

    { clone = ["Skill Dash Blood Attack", "Skill Attack Special Rush Traverser", "Skill Attack Special Rush Dash Fx"], from = "Carmilla", rename = { "Skill Dash Blood Attack" = "Hyper Dash Attack", "Skill Attack Special Rush Traverser" = "Hyper Dash Traverser", "Skill Attack Special Rush Dash Fx" = "Hyper Dash Dash Fx" } },
    { clone = ["Wolf Agressive Defense FMod Event Anim", "Wolf Agressive Defense FMod Event Active"], from = "Red", rename = { "Wolf Agressive Defense FMod Event Anim" = "Hyper Dash Agressive Defense Anim FMod Event", "Wolf Agressive Defense FMod Event Active" = "Hyper Dash Agressive Defense Active FMod Event" } },

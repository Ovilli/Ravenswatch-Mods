[mod]
id           = "test-reward-ban"
name         = "TEST: reward counts"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. Forces 3 astrolabs from Dark Hills camp rewards (vanilla 0-1). Pass: rsmm log --grep reward-proof counts 3 astrolabs in the scene."
enabled     = true
load_order   = 96
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind = "reward"
id   = "test_three_astrolabs"
base = "Camp_Rewards_Dark_Hills_Update5"
# reward_types index 2 = the astrolab type (T1/T2/T3), vanilla [0, 1].
[content.counts]
2 = [3, 3]

[mod]
id           = "test-reward-ban"
name         = "TEST: reward counts"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. Dark Hills camp rewards: exactly 3 astrolabs (vanilla 0-1) and NO dream crystals (vanilla 1-3). Pass: rsmm log --grep reward-proof counts 3 astrolabs and 0 crystals in Dark Hills."
enabled     = false
load_order   = 96
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind = "reward"
id   = "test_three_astrolabs"
base = "Camp_Rewards_Dark_Hills_Update5"
# The dream crystal type places 1..3 in vanilla, so ZERO crystals is a ban
# that cannot be mistaken for bad luck. (Astrolabs 0..1 -> 3 is PROVEN,
# 2026-09-19 session ed36; kept as a repeat check.)
ban  = ["DreamCrystal"]
# reward_types index 2 = the astrolab type (T1/T2/T3), vanilla [0, 1].
[content.counts]
2 = [3, 3]

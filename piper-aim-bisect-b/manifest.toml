# Throwaway bisect for "right stick aim lost with piper-horde-rats" (2026-10-23).
# Enable ONE piper-aim-bisect-* at a time (and not piper-horde-rats), play Piper
# on a controller, and check whether the right stick still aims basic attacks.

[mod]
id          = "piper-aim-bisect-b"
name        = "Piper aim bisect B"
version     = "0.1.0"
author      = "Ovilli"
license     = "MIT"
description = "ONLY the basic-attack rewire of the Horde rats mod."
sdk_version = "3"
enabled     = false
tags        = ["piper", "test"]
experimental = true
multiplayer_scope = "deterministic-shared"
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind = "talent"
id   = "basic_rewire"
hero = "Piper"
file = "Hero_Piper.entity"

clone_nodes = [
  { source = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC Event Sender", name = "HORDE_ATTACKS_COUNTER_INC Event Sender", rename = [
    { from = "SKILL_ATTACK_GHOST_NOTES_COUNTER_INC", to = "HORDE_ATTACKS_COUNTER_INC" },
  ] },
  # Two distinct children to repoint, which is why the POWER shot event is the
  # template: Ghost Notes' notify tester, then Horde's sender.
  { source = "Event Primary Ability Shoot", name = "Horde Basic Attack Notify", retarget = [
    { from = '[State] Hero_Piper\Ability Common\Event Attack Shoot Active', to = '[Cpnt Value Tester] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Notify Tester' },
    { from = '[Named Event Sender] Hero_Piper\Ability Primary\Primary Ability Increase Shoot Spawn Index Event Sender', to = '[Named Event Sender] Hero_Piper\Skill Trait More Controllable Pets\HORDE_ATTACKS_COUNTER_INC Event Sender' },
  ] },
  { source = "Event Attack Shoot Active", name = "Horde Basic Attack Shoot", retarget = [
    { from = '[Cpnt Value Tester] Hero_Piper\Skill Attack Ghost Notes\Skill Attack Ghost Notes Notify Tester', to = '[State] Hero_Piper\Skill Trait More Controllable Pets\Horde Basic Attack Notify' },
  ] },

  # -- the card text's numbers (v0.4.1) ----------------------------------------
  # Talent cards never spell out rarities: every number is a `{N}` placeholder
  # fed by a String Format node, so the card shows the value for the CURRENT
  # rarity and an upgrade shows what it adds (`&{N}~` marks a value that grows
  # with rarity, `#{N}@` a fixed one). Horde's own format has 3 slots and the
  # new text needs 5, so copy the only 5-slot format on Piper (Sound Barrier's)
  # and point each slot at the Horde value, then give the copy Horde's text key.
  # Slots 1 / 3 / 4 read float values in the source; the clone gives each slot
  # the accessor and value type of the Horde value it now reads.
  #   {0} rats per trigger  (3 / 4 / 5 / 5)   {1} basic attacks needed (20 / 18 / 16 / 14)
  #   {2} rats per group    (Horde: 3)        {3} rats per group without Horde (2)
  #   {4} extra max rats    (6 / 8 / 10 / 12)
]

rewires = [
  # Only the BASIC attack shot goes through Horde's notify.
  { trigger = '[State] Hero_Piper\Ability Common\Event Attack Shoot Active', action = "Horde Basic Attack Shoot", exact = true, within = "Event Basic Attack Shoot Active", within_span = 300 },
]

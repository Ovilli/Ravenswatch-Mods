# TEST — R.ability, R.shards.gain, R.ingredient (EXPERIMENTAL SDK APIs,
# static RE 2026-10-10). All three send the game's own events to the hero.
#
# init.lua:
#   * resets EVERY cooldown right after the hero finishes an ability (CLEAR_CD)
#   * once per run, after the hero first acts: +2 dash charges
#     (ADD_DASH_CHARGE), +50 dream shards as a pickup (GAIN_DREAM_SHARDS),
#     +2 keys (GAIN_INGREDIENT "Key"), and level 6 via R.xp.set_level (5000 XP if refused)
#     so the ultimate unlocks
#
# WHAT TO CHECK IN GAME (any hero, solo first)
#   1. Cooldowns: use your ULTIMATE, then try it again at once. Pass = it is
#      ready straight away; same for the other abilities.
#   2. Shards: the counter rises by AT LEAST 50 early in the run (more if you
#      carry a shard-gain item: the game's bonuses apply to this path).
#   3. Keys: the key counter shows 2 more; a locked chest opens with one.
#   4. Dash: if your hero's dash has charges, 2 extra. Dashes without charges
#      ignore it.
#   5. `rsmm log | grep -E "rsmm\.(ability|shards|ingredient)|hero-events"`
#      shows each `dispatched ...` line and the `bus ...` echo for each event.
[mod]
id          = "hero-events-test"
name        = "Hero Events Test"
version     = "0.1.0"
author      = "test"
description = "TEST: no cooldowns + 50 shards + 2 keys per run — checks R.ability / R.shards.gain / R.ingredient."
enabled     = false
sdk_version = ">=3.0,<4"
tags        = []
license     = ""
# R.shards.get reads the hero (hero capture), for the before/after log line.
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

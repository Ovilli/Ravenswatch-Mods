# Damage Meter — Deutsch
#
# What the desktop app and `rsmm overlay` show in this language. The
# in-game log board stays English (it is a debugging view).

[manifest]
name        = "Schadensmesser"
summary     = "Schaden, Anteil und DPS pro Spieler in Koop-Runs, mit einem Live-Overlay im Vordergrund."
description = "Schadensanzeige pro Spieler für Koop – wer trägt den Run? Liest die eigenen Angriffe und den übertragenen Schaden, erfasst jeden Helden und zeigt Schaden, Anteil und laufende DPS."

[overlay]
title = "Schaden"
empty = "Warte auf einen Run."

[overlay.columns]
label = "Spieler"
dealt = "Schaden"
share = "Anteil"
dps   = "DPS"
act_1 = "Akt 1"
act_2 = "Akt 2"
act_3 = "Akt 3"

[config.report_seconds]
label = "Sekunden zwischen Ranglisten-Berichten (0 = nur auf Anfrage)"

[config.snapshot_seconds]
label = "Sekunden zwischen Overlay-Aktualisierungen (0 = aus)"

[config.window_seconds]
label = "Zeitfenster für den DPS-Wert"

[config.quiet_when_idle]
label = "Bericht auslassen, wenn sich seit dem letzten nichts geändert hat"

[config.ignore_scenery]
label = "Nur Schaden an Gegnern zählen (Zäune, Krüge, Requisiten ignorieren)"

[config.probe_victims]
label = "Die ersten Ziele protokollieren (Fehlersuche bei der Gegnererkennung)"

[config.log_hits]
label = "Jeden einzelnen Treffer protokollieren (sehr viel – nur zur Fehlersuche)"

[config.guess_names]
label = "Unbekannten Zeilen die übrigen Lobby-Namen nach Beitrittsreihenfolge geben (mit ? markiert)"

[config.roster_rows]
label = "Alle Spieler der Lobby anzeigen, auch bevor sie Schaden verursachen"

[config.identity_scan]
label = "Speicher durchsuchen, um Verbündeten echte Namen zu geben (aus = Namen bleiben Vermutungen)"

[config.split_by_act]
label = "Schaden nach Akt aufteilen (Spalten Akt 1–3 und Zusammenfassung pro Akt)"

[config.player_1]
label = "Name des ersten Spielers (leer = automatisch)"

[config.player_2]
label = "Name des zweiten Spielers (leer = automatisch)"

[config.player_3]
label = "Name des dritten Spielers (leer = automatisch)"

[config.player_4]
label = "Name des vierten Spielers (leer = automatisch)"

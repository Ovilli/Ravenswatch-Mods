# Damage Meter — Polski
#
# What the desktop app and `rsmm overlay` show in this language. The
# in-game log board stays English (it is a debugging view).

[manifest]
name        = "Licznik obrażeń"
summary     = "Obrażenia, udział i DPS każdego gracza w kooperacji, z oknem na żywo zawsze na wierzchu."
description = "Śledzenie obrażeń każdego gracza w kooperacji – kto ciągnie rozgrywkę? Odczytuje twoje ataki i obrażenia przesyłane przez sieć, śledzi każdego bohatera i pokazuje obrażenia, udział i bieżący DPS."

[overlay]
title = "Obrażenia"
empty = "Czekam na rozgrywkę."

[overlay.columns]
label = "Gracz"
dealt = "Obrażenia"
share = "Udział"
dps   = "DPS"
act_1 = "Akt 1"
act_2 = "Akt 2"
act_3 = "Akt 3"

[config.report_seconds]
label = "Sekundy między raportami tabeli (0 = tylko na żądanie)"

[config.snapshot_seconds]
label = "Sekundy między odświeżeniami okna (0 = wyłączone)"

[config.window_seconds]
label = "Okno czasu dla wartości DPS"

[config.quiet_when_idle]
label = "Pomiń raport, jeśli nic się nie zmieniło od poprzedniego"

[config.ignore_scenery]
label = "Licz tylko obrażenia zadane wrogom (pomijaj płoty, dzbany, rekwizyty)"

[config.probe_victims]
label = "Zapisz pierwsze trafione cele (debugowanie rozpoznawania wrogów)"

[config.log_hits]
label = "Zapisuj każde trafienie (bardzo dużo wpisów – tylko do debugowania)"

[config.guess_names]
label = "Daj niezidentyfikowanym wierszom pozostałe nazwy z lobby według kolejności dołączenia (oznaczone ?)"

[config.roster_rows]
label = "Pokazuj wszystkich graczy z lobby, nawet zanim zadadzą obrażenia"

[config.identity_scan]
label = "Przeszukuj pamięć, by pokazać prawdziwe nazwy sojuszników (wył. = nazwy zgadywane)"

[config.split_by_act]
label = "Dziel obrażenia na akty (kolumny Akt 1–3 i podsumowanie każdego aktu)"

[config.player_1]
label = "Nazwa pierwszego gracza (puste = automatycznie)"

[config.player_2]
label = "Nazwa drugiego gracza (puste = automatycznie)"

[config.player_3]
label = "Nazwa trzeciego gracza (puste = automatycznie)"

[config.player_4]
label = "Nazwa czwartego gracza (puste = automatycznie)"

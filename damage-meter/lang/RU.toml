# Damage Meter — Русский
#
# What the desktop app and `rsmm overlay` show in this language. The
# in-game log board stays English (it is a debugging view).

[manifest]
name        = "Счётчик урона"
summary     = "Урон, доля и DPS каждого игрока в кооперативе, с окном поверх игры в реальном времени."
description = "Учёт урона каждого игрока в кооперативе: кто тащит забег? Читает ваши атаки и урон, переданный по сети, отслеживает каждого героя и показывает урон, долю и текущий DPS."

[overlay]
title = "Урон"
empty = "Ожидание забега."

[overlay.columns]
label = "Игрок"
dealt = "Урон"
share = "Доля"
dps   = "DPS"
act_1 = "Акт 1"
act_2 = "Акт 2"
act_3 = "Акт 3"

[config.report_seconds]
label = "Секунд между отчётами таблицы (0 = только по запросу)"

[config.snapshot_seconds]
label = "Секунд между обновлениями окна (0 = выкл.)"

[config.window_seconds]
label = "Окно времени для расчёта DPS"

[config.quiet_when_idle]
label = "Пропускать отчёт, если ничего не изменилось"

[config.ignore_scenery]
label = "Считать только урон по врагам (без заборов, кувшинов и декораций)"

[config.probe_victims]
label = "Записывать первые поражённые цели (отладка распознавания врагов)"

[config.log_hits]
label = "Записывать каждый удар (очень много записей — только для отладки)"

[config.guess_names]
label = "Давать неопознанным строкам оставшиеся имена из лобби по порядку входа (с пометкой ?)"

[config.roster_rows]
label = "Показывать всех игроков лобби, даже до первого урона"

[config.identity_scan]
label = "Искать в памяти настоящие имена союзников (выкл. = имена остаются предположением)"

[config.split_by_act]
label = "Делить урон по актам (столбцы Акт 1–3 и итоги каждого акта)"

[config.player_1]
label = "Имя первого игрока (пусто = автоматически)"

[config.player_2]
label = "Имя второго игрока (пусто = автоматически)"

[config.player_3]
label = "Имя третьего игрока (пусто = автоматически)"

[config.player_4]
label = "Имя четвёртого игрока (пусто = автоматически)"

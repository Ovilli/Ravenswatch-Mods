# TEST — proves R.status.clear_stagger / reset_stagger_resilience from the LOG,
# since the stagger bar is impossible to watch in a fight.
#
# R.status.watch_stagger() hooks the game's CLEAR_STAGGER handler read-only and
# logs the hero's stagger values before and after every clear.
#   1. Use any ability once -> one clear that captures the hero's controller
#      ("stagger 0.0 -> 0.0" is expected there).
#   2. Then play and let elites / bosses hit you until you are actually
#      staggered. Every 0.1 s the mod logs changes of the stagger BAR and of
#      RESILIENCE (it grows each time you are staggered), and clears both when
#      either is up. A heartbeat line every 30 s proves the poll is alive.
#
# PASS: "resilience 0.000 -> X  <- you were STAGGERED", then the clear lines
# showing the bar / resilience going back to 0.
# `rsmm log | grep -E "stagger-test|rsmm\.status"`
[mod]
multiplayer_scope = "deterministic-shared"
id          = "stagger-test"
name        = "Stagger Test"
version     = "0.1.0"
author      = "test"
description = "TEST: logs the hero's stagger value and clears it whenever it rises — proves R.status.clear_stagger from the log."
enabled     = false
sdk_version = ">=3.0,<4"
tags        = []
license     = ""

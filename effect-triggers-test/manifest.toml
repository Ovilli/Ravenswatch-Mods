#:schema https://docs.rsmm.me/manifest.schema.json

# TESTING ONLY. One item per `effect` trigger, all on an Increase_Shield base.
# Trigger k gives 2^k / 1024 Life on hit for 5 s. init.lua decodes each CHANGE of
# life on hit: +2^k units = trigger k on, -2^k units = off. Life on hit, not crit:
# the hero's own crit moved with talents and levels and leaked into the decode,
# and whole-number crit never showed at all (2026-10-20). Binary units keep the
# sums exact in f32. Generated from rsmm.engine.item_effect.TRIGGERS.

[mod]
id          = "effect-triggers-test"
name        = "Effect triggers test"
version     = "0.4.0"
author      = "RSMM"
summary     = "Playtest for every item effect trigger"
description = "14 test items, one per effect trigger, granted at run start. init.lua logs each trigger as it fires and ends."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = ["item", "test"]
license     = "MIT"
multiplayer_scope = "deterministic-shared"
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind         = "item"
id           = "Test_Trigger_damage_taken"
base         = "Increase_Shield"
rarity       = "Common"
name         = "TEST 0: damage_taken"
description  = "After taking damage, gain #+{0}@ #Life on hit@ for #{1}@ seconds"
super_effect = false
effect       = { stat = "Life on hit", amount = 0.0009765625, seconds = 5, on = "damage_taken", percent = false }


#:schema https://docs.rsmm.me/manifest.schema.json

# TESTING ONLY. One item per `effect` trigger, all on an Increase_Shield base.
# Trigger k gives 2^k crit chance (whole numbers) for 5 s, so init.lua decodes
# which triggers are active from the whole part of the crit value; the hero's
# own crit (a fraction, 0.05 base) cannot leak in. 1/1000 steps could (2026-10-20). Generated from
# rsmm.engine.item_effect.TRIGGERS (2026-10-20); regenerate if that list changes.

[mod]
id          = "effect-triggers-test"
name        = "Effect triggers test"
version     = "0.2.0"
author      = "RSMM"
summary     = "Playtest for every item effect trigger"
description = "14 test items, one per effect trigger, granted at run start. init.lua logs each trigger as it fires and ends."
enabled     = true
sdk_version = ">=3.0,<4"
tags        = ["item", "test"]
license     = "MIT"
multiplayer_scope = "deterministic-shared"
loader_flags = ["RSMM_ENABLE_HERO_CAPTURE"]

[[content]]
kind         = "item"
id           = "Test_Trigger_damage_taken"
base         = "Increase_Shield"
rarity       = "Common"
name         = "TEST 0: damage_taken"
description  = "After taking damage, gain #+{0}%@ #Crit Chance@ for #{1}@ seconds"
super_effect = false
effect       = { stat = "Crit chance", amount = 1, seconds = 5, on = "damage_taken" }


[mod]
id           = "test-boss-swap"
name         = "TEST: ghoul den fights the crab"
version      = "0.1.0"
author       = "RSMM"
description  = "Dev test. The Dark Hills ghoul den AND the White Lady shrine spawn the Storm Island giant crab (Boss_Crab). Pass: rsmm log --grep boss-proof shows Boss_Crab in Dark Hills (the den boss is listed at level start; the White Lady appears when her shrine is activated)."
enabled      = true
load_order   = 96
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["dev", "testing"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind    = "boss"
id      = "ghoul_den_crab"
base    = "Boss_Marsh_Ghoul"
becomes = "Boss_Crab"

# The ghoul den only generates on some Dark Hills maps (it did not on 2026-09-19
# ed36), but the White Lady shrine did — so swap her too. Either arena showing
# a Boss_Crab in Dark Hills proves the swap.
[[content]]
kind    = "boss"
id      = "white_lady_crab"
base    = "Boss_White_Lady"
becomes = "Boss_Crab"

# FIRST BOOT TEST of a hero written from scratch (roadmap "Hero from scratch A").
#
# NO base hero: nothing of any hero is copied. JackSelf's entities
# (engine/hero_frame.py), buttons (engine/hero_ability.py) and roster record
# (engine/herodef_frame.py) are written from data on the shared hero base;
# his alias, text and preload lists are his own. The rig (Kintaro) lends
# ASSETS only: a skeleton, on-foot clips, his mesh and UI art, until Jack has
# a model and animations of his own.
#
# What to check in game:
#   * JackSelf is on the hero-select screen WITH his body and plays his poses;
#   * a run starts: he stands, walks, runs, dashes, gets hit, dies/revives;
#   * every button (step B) plays its animation, hits around him at the times
#     below and ends (he never gets stuck in a move); talents are empty cards.
# If the run does not start or the game crashes, send the log.

[mod]
id           = "jack-frame"
name         = "Jack (from scratch, boot test)"
version      = "0.5.0"
author       = "Ovilli"
description  = "First boot test of a hero written from scratch: Jack's own files, no other hero inside."
enabled      = true
load_order   = 96
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes", "test"]
multiplayer_scope = "deterministic-shared"
experimental = true
# Talent probe (temporary): with the loader's [talent-guard], dumps every
# hero's talent rows the first time a talent card has no controller.
loader_flags = ["RSMM_ENABLE_SKILL_HOOK"]

[[content]]
kind        = "hero"
id          = "JackSelf"
name        = "Jack"
description = "Jack traded the family cow for a handful of beans, and by morning a beanstalk reached the clouds. Now every pocket is full of magic beans, and every bean is a beanstalk waiting to happen."

[content.frame]
rig      = "Hero_Kintaro"
mesh     = "Characters\\Heroes\\Kintaro\\Kintaro_GEO.fbx"
material = "Characters\\Heroes\\Kintaro\\Textures\\M_Kintaro.mat.ot"
albedo   = "art/jack_body_alb.png"
# His own body and proportions (step D): longer legs and arms, a longer
# spine, the same head (art/jack_proportions.json, made by a Blender
# proportions pass on the rig). Its skeleton is written from this armature.
model    = "art/jack_body.glb"

# --- His ultimate cards ---------------------------------------------------------
# Hero_Common's six ultimate controllers, as his own cards (left alone they are
# blank). The upgrades' effects hang off a state of their own.
[content.frame.ultimates."Ultimate Power 1"]
title       = "The Giant Falls"
description = "• Fell the beanstalk: the giant comes crashing down ahead of you, #stunning@ everything and leaving it #VULNERABLE@"
icon        = "Heroes\\Kintaro\\Ability_Kintaro_Ultimate_1.png"

[content.frame.ultimates."Ultimate 1 Upgrade 1"]
title       = "Bigger They Are"
description = "• #ULTIMATE@ deals #+30%@ damage"
add_stats   = [ { stat = "Attack power ultimate", values = [0.3, 0.3, 0.3, 0.3] } ]

[content.frame.ultimates."Ultimate 1 Upgrade 2"]
title       = "Harder They Fall"
description = "• #ULTIMATE@ deals #+15%@ damage for each status on the enemy"
add_stats   = [ { stat = "Increase ultimate damage for each debuff", values = [0.15, 0.15, 0.15, 0.15] } ]

[content.frame.ultimates."Ultimate Power 2"]
title       = "Giant-Slayer"
description = "• Hurl three spinning axes ahead that burst on impact, and #stun@ and #BLEED@ everything close"
icon        = "Heroes\\Kintaro\\Ability_Kintaro_Ultimate_2.png"

[content.frame.ultimates."Ultimate 2 Upgrade 1"]
title       = "Keen Edges"
description = "• #ULTIMATE@ gains #+25%@ Crit Chance"
add_stats   = [ { stat = "Crit chance ultimate", values = [0.25, 0.25, 0.25, 0.25] } ]

[content.frame.ultimates."Ultimate 2 Upgrade 2"]
title       = "Fee-Fi-Fo-Fast"
description = "• #ULTIMATE@ cooldown is reduced by #25%@"
add_stats   = [ { stat = "CD reduce ultimate", values = [0.25, 0.25, 0.25, 0.25] } ]

# --- His axe, in his hand -------------------------------------------------------
[content.frame.weapon]
# His own axe (handle along +Y, grip at the origin); Aladdin's right-hand
# sword lends only the hand-weapon layout (DEF.Weapon.R, always shown).
from   = "Aladdin"
model  = "art/jack_axe_hand.glb"
albedo = "art/projectiles/jack_projectiles_alb.png"

# --- His own projectiles ------------------------------------------------------
# Each an entity of his own on the engine's generic hero projectile, wearing
# his own mesh and map; fired by `steps` with fire = "own:<id>" (speed,
# damage, size, explode, knockback, root ... set per shot there).
[content.frame.projectiles.Axe]
model    = "art/projectiles/jack_axe.glb"
albedo   = "art/projectiles/jack_projectiles_alb.png"
scale    = 2.0
lifetime = 0.8
trail    = "fx:AxeTrail"
impact   = "fx:WoodChips"

[content.frame.projectiles.Bean]
model    = "art/projectiles/jack_bean.glb"
albedo   = "art/projectiles/jack_projectiles_alb.png"
scale    = 2.2
lifetime = 0.6
trail    = "fx:BeanTrail"
impact   = "fx:BeanBloom"


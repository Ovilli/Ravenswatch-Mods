[[content.memoirs]]
title = "Milky-White"
text  = "There was a widow's boy named Jack, and a cow named Milky-White who gave no more milk. \"Take her to market,\" said his mother, \"and bring back money, or we starve.\""

[[content.memoirs]]
title = "Five Beans"
text  = "On the road he met a stranger with five beans in his palm, speckled like eggs. \"Magic,\" said the stranger. Jack traded the cow, and his mother threw the beans out of the window."

[[content.memoirs]]
title = "Overnight"
text  = "In the night the beans woke. By morning the stalk was thick as a tower and green as poison. Jack took his father's axe, and he climbed."

[[content.memoirs]]
title = "Fee-Fi-Fo-Fum"
text  = "At the top stood a castle, and in it a giant who ground bones to make his bread. Jack hid in the copper pot until the snoring shook the walls."

[[content.memoirs]]
title = "Timber"
text  = "The giant came down the beanstalk after him, each step a thunderclap. Jack swung the axe until the stalk groaned, and leaned, and fell."

[[content.memoirs]]
title = "Pockets Full"
text  = "He kept the last beans. Every one he plants is a beanstalk, and every beanstalk is a weapon."

[[content.memoirs]]
title = "Giant-Slayer"
text  = "\"The bigger they are,\" Jack tells the Nightmares, sharpening the blade, \"the further they fall.\""


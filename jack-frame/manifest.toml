[content.frame.abilities.defense]
name        = "Fee-Fi-Fo-Fum!"
description = "• Shout so loud the beans in your pockets pop around you"
clip        = "anim:Shout"
duration    = 1.05
cooldown    = 8
hits        = [ { at = 0.35, radius = 3, damage = 80 } ]

[content.frame.abilities.trait]
name        = "Magic Bean"

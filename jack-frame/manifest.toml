# His talents: his own list (the name's first word is its column in the book).
# Effects are written on each talent (talent factory): add_stats = numbers per
# rarity ({0} on the card), actions = area hits each time `on` fires while the
# talent is owned (dash, power, special, defense, ultimate, damage_taken ...).
# `starter = true`: in the pick at the start of a run. A hit's `fx` is its look.
# `steps` (engine/hero_kit.py): projectiles (fire), hit areas placed `forward`
# metres ahead, heals, summons, waits and repeats, on the button or the action.
# Hits can also stun (s), knockback, stagger and apply a status (Rooted, Weak,
# Vulnerable, Bleed, Chilled, Ignite): Jack's beans set enemies up, and the
# "for each status" talents pay it off.
[[content.frame.talents]]
name        = "Attack Sharp Axe"
title       = "Sharp Axe"
description = "• #ATTACK@ gains &+{0}%~ #Crit Chance@"
add_stats   = [ { stat = "Crit chance basic", values = [0.08, 0.12, 0.16, 0.20] } ]
starter     = true

[[content.frame.talents]]
name        = "Attack Rhythm"
title       = "Tangled Up"
description = "• #ATTACK@ deals &+{0}%~ damage for each status on the enemy"
add_stats   = [ { stat = "Increase basic damage for each debuff", values = [0.08, 0.12, 0.16, 0.20] } ]

[[content.frame.talents]]
name        = "Attack Splinters"
title       = "Splinters"
description = "• Critical hits make enemies #Bleed@"
add_stats   = [ { stat = "Apply bleed on critical", values = [1, 1, 1, 1], percent = false } ]

[[content.frame.talents]]
name        = "Power Twin Beanstalks"
title       = "Twin Beanstalks"
description = "• Timber! also flings a magic bean further ahead that bursts for #120%@ area damage"
actions     = [ { on = "power", steps = [ { wait = 0.5 }, { fire = "own:Bean", speed = 14, lifetime = 0.4, damage = 120, size = 1.8, explode = 3.5, forward = 0.5 } ] } ]
starter     = true

[[content.frame.talents]]
name        = "Power Seed Pods"
title       = "Thorny Pods"
description = "• Timber! leaves thorny pods that burst a moment later for #100%@ area damage and #Bleed@"
actions     = [ { on = "power", hits = [ { at = 1.2, radius = 4, damage = 100, status = "Bleed", fx = "fx:BeanBloom" } ] } ]

[[content.frame.talents]]
name        = "Power Deep Roots"
title       = "Deep Roots"
description = "• #POWER@ cooldown is reduced by &{0}%~"
add_stats   = [ { stat = "CD reduce primary", values = [0.10, 0.15, 0.20, 0.25] } ]

[[content.frame.talents]]
name        = "Special Whirligig"
title       = "Whirligig"
description = "• Woodcutter's Whirl spins once more for #150%@ area damage"
actions     = [ { on = "special", hits = [ { at = 1.0, radius = 4, damage = 150, fx = "fx:LeafSwirl" } ] } ]

[[content.frame.talents]]
name        = "Special Harvest"
title       = "Harvest Season"
description = "• #SPECIAL@ deals &+{0}%~ damage for each status on the enemy"
add_stats   = [ { stat = "Increase secondary damage for each debuff", values = [0.10, 0.15, 0.20, 0.25] } ]

[[content.frame.talents]]
name        = "Special Runner Bean"
title       = "Runner Bean"
description = "• Woodcutter's Whirl shoots runner beans in every direction that #Root@ what they hit"

# FIRST BOOT TEST of a hero written from scratch (roadmap "Hero from scratch A").
#
# NO base hero: nothing of any hero is copied. JackSelf's entities
# (engine/hero_frame.py), buttons (engine/hero_ability.py) and roster record
# (engine/herodef_frame.py) are written from data on the shared hero base;
# his alias, text and preload lists are his own. The rig (Kintaro) lends
# ASSETS only: a skeleton, on-foot clips, his mesh and UI art, until Jack has
# a model and animations of his own.
#
# What to check in game:
#   * JackSelf is on the hero-select screen WITH his body and plays his poses;
#   * a run starts: he stands, walks, runs, dashes, gets hit, dies/revives;
#   * every button (step B) plays its animation, hits around him at the times
#     below and ends (he never gets stuck in a move); talents are empty cards.
# If the run does not start or the game crashes, send the log.

[mod]
id           = "jack-frame"
name         = "Jack (from scratch, boot test)"
version      = "0.4.0"
author       = "Ovilli"
description  = "First boot test of a hero written from scratch: Jack's own files, no other hero inside."
enabled      = true
load_order   = 96
sdk_version  = ">=3.0,<4"
license      = "MIT"
tags         = ["heroes", "test"]
multiplayer_scope = "deterministic-shared"
experimental = true

[[content]]
kind        = "hero"
id          = "JackSelf"
name        = "Jack"
description = "Jack traded the family cow for a handful of beans, and by morning a beanstalk reached the clouds. Now every pocket is full of magic beans, and every bean is a beanstalk waiting to happen."

[content.frame]
rig      = "Hero_Kintaro"
mesh     = "Characters\\Heroes\\Kintaro\\Kintaro_GEO.fbx"
material = "Characters\\Heroes\\Kintaro\\Textures\\M_Kintaro.mat.ot"
albedo   = "art/jack_kintaro_alb.png"

